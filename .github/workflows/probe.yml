name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import collections, rytas
          for eid in ("PNJMMUNJYB", "XQJJRQXKLA"):
              try:
                  p = rytas.fetch_prices(eid)
              except Exception as e:
                  print(eid, "ERR", e); continue
              print("== prices", eid, "top keys", list(p))
              secs = p.get("eventSections", [])
              multi = [s for s in secs if len(s.get("priceZones", [])) > 1 or any(len(z.get("ticketTypes", [])) > 1 for z in s.get("priceZones", []))]
              print("sections", len(secs), "with >1 zone or >1 ticket type:", len(multi))
              for s in (multi[:4] or secs[:1]):
                  print(" section", s["id"], s["title"], "keys", [k for k in s if k != "priceZones"])
                  for z in s["priceZones"]:
                      print("   zone", {k: v for k, v in z.items() if k != "ticketTypes"})
                      for t in z["ticketTypes"]:
                          print("     tt", t)
                  seats = rytas.fetch_section_seats(eid, str(s["id"])) or []
                  print("   seat priceClass counts", collections.Counter((t.get("priceClass"), t.get("status")) for t in seats))
                  if seats: print("   seat keys", list(seats[0]))
          PY
