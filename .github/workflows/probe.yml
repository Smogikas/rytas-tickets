name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import collections, time, rytas, urllib.error
          A = rytas.API
          vm = rytas.get_json(f"{A}/store/seat-map/1769507581")
          secs = sorted({str(x["section"]) for x in vm["seats"]})
          print("venue sections", len(secs))
          for eid in ("PNJMMUNJYB", "ZMS7IPCJGD"):
              listed = {str(s["id"]) for s in rytas.fetch_prices(eid)["eventSections"]}
              tot = collections.Counter()
              for sid in secs:
                  time.sleep(0.25)
                  try:
                      t = rytas.get_json(f"{A}/store/events/{eid}/sections/{sid}/seat-map?language=lt").get("seatMapTickets") or []
                  except urllib.error.HTTPError as e:
                      tot["absent"] += 1
                      continue
                  st = collections.Counter(x.get("status") for x in t)
                  pcs = collections.Counter(x.get("priceClass") for x in t)
                  priced = sum(n for pc, n in pcs.items() if pc not in (0, None))
                  kind = "LISTED" if sid in listed else "hidden"
                  tot[kind] += 1
                  if kind == "hidden":
                      print(f"R {eid} {sid} seats={len(t)} taken={st.get(0,0)} free={st.get(1,0)} priced={priced} pcs={dict(list(pcs.items())[:4])}")
              print("T", eid, dict(tot))
          PY
