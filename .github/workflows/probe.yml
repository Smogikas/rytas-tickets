name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
      SHEET_ID: 12u2OBPsVzivfjZopgrjTtUKfc-TtXARYcEODmzRVGaM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth==2.38.0 requests==2.32.3
      - run: |
          python sheets.py pull
          python - <<'PY'
          import collections, rytas
          ev = rytas.load_events()
          for eid, meta in ev["events"].items():
              prices = sorted(rytas.load_snapshots(eid), key=lambda r: r["ts_utc"])
              listed_now, vanished = {}, {}
              for r in prices:
                  listed_now.setdefault(r["section_id"], {})[(r.get("zone",""), r["ticket_type_id"])] = r["available"]
              for sid, zones in listed_now.items():
                  if all(a == 0 for a in zones.values()):
                      vanished[sid] = max(r["ts_utc"] for r in prices if r["section_id"] == sid and r["available"] == 0)
              seats = rytas.load_seats(eid)
              for sid, t in vanished.items():
                  after = [s for s in seats if s["section_id"] == sid and s["ts_utc"] >= t]
                  st = collections.Counter(s["status"] for s in after)
                  title = next((r["section"] for r in prices if r["section_id"] == sid), sid)
                  print("V", meta["start_utc"][:10], sid, title, "vanished", t[:16], "seat rows after:", dict(st))
              pc0 = collections.Counter(s["price_class"] for s in seats if str(s["price_class"]).strip() in ("0", "0.0"))
              print("P", meta["start_utc"][:10], "seat rows with priceClass 0:", sum(pc0.values()))
          PY
