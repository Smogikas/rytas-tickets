name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json, rytas
          A = rytas.API
          def show(name, url, depth=600):
              try:
                  j = rytas.get_json(url)
              except Exception as e:
                  print("==", name, "ERR", e); return None
              print("==", name, "keys", list(j) if isinstance(j, dict) else type(j))
              print("  ", json.dumps({k: v for k, v in j.items() if k not in ("seatMapTickets", "seats")} if isinstance(j, dict) else j, ensure_ascii=False)[:depth])
              return j
          sm = show("seat-map 83548", f"{A}/store/events/PNJMMUNJYB/sections/83548/seat-map?language=lt", 1500)
          ev = show("event", f"{A}/events/PNJMMUNJYB?language=lt", 2500)
          st = show("store event", f"{A}/store/events/PNJMMUNJYB?language=lt", 2500)
          pc = show("price classes", f"{A}/store/events/PNJMMUNJYB/price-classes?language=lt", 1500)
          pz = show("price zones", f"{A}/store/events/PNJMMUNJYB/price-zones?language=lt", 1500)
          j = rytas.fetch_prices("ZPHZTQITUH")
          for s in j["eventSections"]:
              if len(s["priceZones"]) > 1 or any(len(z["ticketTypes"]) > 1 for z in s["priceZones"]):
                  print("multi", s["id"], s["title"], [(z["id"], z["description"], [(t["name"], t["price"], t["fee"], t["availableTickets"]) for t in z["ticketTypes"]]) for z in s["priceZones"]])
          PY
