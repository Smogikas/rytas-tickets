name: probe
on: workflow_dispatch
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
      SHEET_ID: 12u2OBPsVzivfjZopgrjTtUKfc-TtXARYcEODmzRVGaM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install google-auth==2.38.0 requests==2.32.3
      - run: |
          python sheets.py pull
          python - <<'PY'
          import rytas
          from collections import Counter, defaultdict
          from datetime import datetime
          from zoneinfo import ZoneInfo
          V = ZoneInfo("Europe/Vilnius"); loc = lambda s: datetime.fromisoformat(s.replace("Z", "+00:00")).astimezone(V).strftime("%m-%d %H:%M")
          ev = rytas.load_events(); names = {e: m["name"] for e, m in ev["events"].items()}
          eid = next(e for e in names if "Jonava" in names[e])
          m = ev["events"][eid]; print("GAME", names[eid], m["start_utc"], "| last seats", m.get("last_seats_utc"), "| final", m.get("final_check_utc"))
          res = rytas.analyse_all(ev, with_seats=True)[eid]; t = res["totals"]
          print("TOTALS", {k: t[k] for k in t if isinstance(t[k], (int, float))})
          # sales (free->taken) per check time today, per section
          tl = rytas.timelines(rytas.load_seats(eid))
          P = rytas.read_csv(rytas.SNAPSHOTS); title = {r["section_id"]: r["section"] for r in P if r["event_id"] == eid}
          by = defaultdict(Counter); opened = defaultdict(Counter); first = Counter()
          for seat, rows in tl.items():
              sid = rows[0]["section_id"]
              if rows[0]["ts_utc"] >= "2026-11-14T22":
                  first[(loc(rows[0]["ts_utc"]), title.get(sid, sid), str(rows[0]["status"]))] += 1
              for a, b in zip(rows, rows[1:]):
                  if str(a["status"]) == "1" and str(b["status"]) == "0" and b["ts_utc"] >= "2026-11-14T22":
                      by[loc(b["ts_utc"])][title.get(sid, sid)] += 1
          for k in sorted(by): print("SOLD", k, sum(by[k].values()), dict(by[k].most_common(6)))
          for k, v in sorted(first.items()): print("NEWSEATS first seen", k, v)
          for x in res["sections"]:
              if x.get("opened_later") or x.get("status") not in ("open",):
                  print("SEC", x.get("section"), x.get("status"), "opened", x.get("opened_later"), "closed", x.get("closed_at"), "pre_taken", x.get("pre_taken"), "sold_seen", x.get("sold_seen"))
          # price rows today
          for r in P:
              if r["event_id"] == eid and r["ts_utc"] >= "2026-11-14T22":
                  print("PRICE", loc(r["ts_utc"]), r["section"], "|", r["zone"], r["price"], "avail", r["available"])
          PY
