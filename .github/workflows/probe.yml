name: probe
on: workflow_dispatch
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
      SHEET_ID: 12u2OBPsVzivfjZopgrjTtUKfc-TtXARYcEODmzRVGaM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install google-auth==2.38.0 requests==2.32.3
      - run: |
          python sheets.py pull
          python - <<'PY'
          import rytas
          from collections import Counter
          ev = rytas.load_events(); names = {e: m["name"] for e, m in ev["events"].items()}
          for e, n in names.items(): print("ORDER", e, ev["events"][e]["start_utc"][:10], n)
          tls = {e: rytas.timelines(rytas.load_seats(e)) for e in names}
          groups = rytas.season_groups(names)
          P = rytas.read_csv(rytas.SNAPSHOTS); title = {r["section_id"]: r["section"] for r in P}
          gs = sorted(set(groups.values()), key=len)
          sets = {g: rytas.season_seats(g, tls) for g in gs if g}
          for g, s in sets.items(): print("GROUP", len(g), len(s))
          big = max(sets, key=len); small = [g for g in sets if g != big]
          for sg in small:
              extra = sets[big] - sets[sg]; less = sets[sg] - sets[big]
              sec = Counter()
              for e in big:
                  for seat in extra:
                      if seat in tls[e]: sec[title.get(tls[e][seat][-1]["section_id"], "?")] += 0
              where = Counter()
              for seat in extra:
                  for e in big:
                      if seat in tls[e]:
                          where[title.get(tls[e][seat][-1]["section_id"], "?")] += 1; break
              print("EXTRA in big vs", len(sg), len(extra), dict(where.most_common(20)), "| only in small", len(less))
              # in which games were these seats seen
              seen = Counter()
              for e in big:
                  n = sum(1 for seat in extra if seat in tls[e])
                  if n: seen[names[e][:60]] = n
              for k, v in seen.items(): print("  seen", v, k)
          PY
