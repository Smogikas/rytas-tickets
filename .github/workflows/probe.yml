name: probe
on: workflow_dispatch
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
      SHEET_ID: 12u2OBPsVzivfjZopgrjTtUKfc-TtXARYcEODmzRVGaM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install google-auth==2.38.0 requests==2.32.3
      - run: |
          python sheets.py pull && python rytas.py export _out
          python - <<'PY'
          import json, rytas
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          V = ZoneInfo("Europe/Vilnius")
          d = json.load(open("_out/data.json", encoding="utf-8"))
          g = next(x for x in d["games"] if "Nanterre" in x["opp"])
          loc = lambda s: datetime.fromisoformat(s.replace("Z", "+00:00")).astimezone(V).strftime("%m-%d %H:%M")
          print("READS")
          prev = None
          for t, v in g.get("dayReads", []):
              print("  ", loc(t), v, "" if prev is None else f"+{v - prev}"); prev = v
          print("SALES (hourly pts, last 16)")
          for t, v in g["sales"][-16:]:
              print("  ", loc(t), v)
          print("sold24", g.get("sold24"), "soldToday?", g.get("soldToday"))
          ev = rytas.load_events(); m = ev["events"][g["id"]]
          print("last_seats_utc", m.get("last_seats_utc"))
          # raw sale times today (local hour histogram)
          res = rytas.analyse_all(ev)[g["id"]]
          from collections import Counter
          c = Counter(loc(t)[:8] + "h" for t in res["sale_times"] if t >= "2026-11-10T21")
          print("SALE_TIMES by scan hour", sorted(c.items()))
          PY
