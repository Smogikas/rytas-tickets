name: Ticket snapshot

on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17: prices every hour, seat plans when due;
                           # the 23:17 (Vilnius) run also looks for new / rescheduled games
  workflow_dispatch:
    inputs:
      add_series:
        description: "Optional: bilietai.lt game URL/id or series id - track the whole season"
        required: false
        default: ""
      add_event:
        description: "Optional: bilietai.lt game URL/id - track a single game"
        required: false
        default: ""
      discover:
        description: "Look for new games in tracked series now"
        type: boolean
        default: false
      seats:
        description: "Fetch seat plans now for every upcoming game (even if not due)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["rytas.py", "sheets.py", "site/**", "tests/**", ".github/workflows/**"]
  pull_request:

permissions:
  contents: read

# one run at a time: runs read and write the same Google Sheet
concurrency:
  group: snapshot
  cancel-in-progress: false

env:
  # the data lives in this Google Sheet (not in the repo); not a secret
  SHEET_ID: 12u2OBPsVzivfjZopgrjTtUKfc-TtXARYcEODmzRVGaM

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v

  run:
    needs: test
    # schedule / manual: collect + save + publish. Code push: only rebuild the page.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # only used until the Google key exists (data committed to the repo)
      actions: write    # keep-alive: re-enable this workflow's schedule (see below)
    env:
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
      COLLECT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    outputs:
      built: ${{ steps.site.outputs.built }}
      soon: ${{ steps.soon.outputs.soon }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth==2.38.0 requests==2.32.3

      # Google Sheet when the GOOGLE_SA_KEY secret exists; until then the data
      # stays in the repo (data/, events.json) as before, so tracking never pauses
      - name: Load data
        id: pull
        run: |
          if [ -n "$GOOGLE_SA_KEY" ]; then
            echo "STORE=sheet" >> "$GITHUB_ENV"
            python sheets.py pull
          else
            echo "STORE=repo" >> "$GITHUB_ENV"
            echo "No GOOGLE_SA_KEY secret yet: using the data in the repository"
          fi

      - name: Add series
        if: env.COLLECT == 'true' && inputs.add_series != ''
        env:
          TARGET: ${{ inputs.add_series }}
        run: python rytas.py add-series "$TARGET"

      - name: Add event
        if: env.COLLECT == 'true' && inputs.add_event != ''
        env:
          EVENT: ${{ inputs.add_event }}
        run: python rytas.py add "$EVENT"

      # daily, in the run that starts at 23:xx Vilnius time (or on request)
      - name: Discover new games
        if: env.COLLECT == 'true'
        env:
          ASKED: ${{ inputs.discover }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$ASKED" = true ] || { [ "$EVENT_NAME" = schedule ] && [ "$(TZ=Europe/Vilnius date +%H)" = 23 ]; }; then
            python rytas.py discover
          else
            echo "Not the 23:xx run: skipped"
          fi

      # GitHub switches off schedules of public repos after 60 days without repository
      # activity, and this job writes to the Sheet, not the repo. Re-enabling the
      # workflow twice a month (1st and 15th, 23:xx; also on manual runs) keeps the hourly schedule alive.
      - name: Keep the schedule alive
        if: env.COLLECT == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || { [ "$(TZ=Europe/Vilnius date +%H)" = 23 ] && { [ "$(date +%d)" = 01 ] || [ "$(date +%d)" = 15 ]; }; }; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/snapshot.yml/enable" && echo "Schedule re-enabled"
          fi

      - name: Snapshot
        if: env.COLLECT == 'true'
        env:
          SEATS: ${{ inputs.seats && '--seats' || '' }}
        run: python rytas.py snapshot $SEATS

      - name: Game starting soon?
        id: soon
        if: env.COLLECT == 'true' && steps.pull.outcome == 'success'
        run: python rytas.py final --check

      # only after a successful load, so rows are never uploaded twice
      - name: Save data
        if: always() && env.COLLECT == 'true' && steps.pull.outcome == 'success'
        run: |
          if [ "$STORE" = sheet ]; then
            python sheets.py push
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data events.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

      - name: Build page
        id: site
        if: always() && steps.pull.outcome == 'success'
        run: |
          python rytas.py export _site
          cp site/index.html _site/
          python rytas.py report > report.txt 2>&1 || true
          cat report.txt
          python rytas.py capacity > capacity.txt 2>&1 || true
          cat capacity.txt
          python rytas.py season 2>&1 || true
          { echo '```'; cat report.txt; echo; cat capacity.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.site.outcome == 'success'
        with:
          path: _site

  deploy:
    needs: run
    if: ${{ !cancelled() && needs.run.outputs.built == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Final full check 10 minutes before tip-off, in its own job so the hourly
  # update is not delayed while it waits.
  final:
    needs: run
    if: ${{ !cancelled() && needs.run.outputs.soon == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth==2.38.0 requests==2.32.3
      - name: Final check before tip-off
        run: |
          python sheets.py pull
          python rytas.py final
          python sheets.py push
          python rytas.py export _site
          cp site/index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-final
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-final
