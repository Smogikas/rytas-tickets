<style>
/* light: cream and brown; sand for free seats */
:root{
  --bg:#F6EFE2; --panel:#FFFAF0; --ink:#2A1C11; --muted:#6B5644; --line:#E2D3BA;
  --accent:#7B4A23; --accent-ink:#FFF8EC; --season:#6F6052; --single:#C47A2C; --free:#F6EFE2; --seat-line:#B8A386;
  --closed:#EFE5D2; --low:#F0E2C8; --mid:#CF9F67; --high:#7B4A23; --court:#D8C7A8; --focus:#7B4A23; --bcl:#2E5C8A; --sel:#C47A2C; --avail:#E2C79C; --fan:#8E3B46;
  --dot-s:#0F8278; --dot-o:#E08A1E; --dot-a:#FFFFFF; --dot-a-line:#A8977F; --dot-a-w:.5; --dot-f:#7C5CB8; --warn:#B4532A; --c1:#008C80; --c2:#C7701A;
  color-scheme: light;
}
/* dark: charcoal with amber; teal for the data (as in light) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1C1E; --panel:#232528; --ink:#ECE9E3; --muted:#A6A39C; --line:#36393D;
    --accent:#E0A458; --accent-ink:#1B1C1E; --season:#3F8F88; --single:#E0A458; --free:#2A2D30; --seat-line:#5A5E63;
    --closed:#232528; --low:#26355A; --mid:#2A9D8F; --high:#F2C14E; --court:#45494E; --focus:#F0C27F; --bcl:#9DB8D9; --sel:#F4EEDC; --avail:#D9DDD4; --fan:#9C83C9;
    --dot-s:#3F8F88; --dot-o:#E0A458; --dot-a:#D9DDD4; --dot-a-line:transparent; --dot-a-w:0; --dot-f:#9C83C9; --warn:#F0A35E; --c1:#12A193; --c2:#D27B27;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1C1E; --panel:#232528; --ink:#ECE9E3; --muted:#A6A39C; --line:#36393D;
  --accent:#E0A458; --accent-ink:#1B1C1E; --season:#3F8F88; --single:#E0A458; --free:#2A2D30; --seat-line:#5A5E63;
  --closed:#232528; --low:#26355A; --mid:#2A9D8F; --high:#F2C14E; --court:#45494E; --focus:#F0C27F; --bcl:#9DB8D9; --sel:#F4EEDC; --avail:#D9DDD4; --fan:#9C83C9;
    --dot-s:#3F8F88; --dot-o:#E0A458; --dot-a:#D9DDD4; --dot-a-line:transparent; --dot-a-w:0; --dot-f:#9C83C9; --warn:#F0A35E; --c1:#12A193; --c2:#D27B27;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible,polygon:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:20px}

.small{font-size:12px}

.seg.small-seg button{padding:5px 9px;font-size:12px}

.modal[hidden]{display:none}

.modal-box img{width:100%;height:auto;display:block}

.bar i{display:block;height:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;font-size:13px}

.arena{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.mapbox{flex:3 1 520px;min-width:0;padding:16px;display:flex;flex-direction:column;gap:12px}
.side{flex:2 1 340px;min-width:0;display:flex;flex-direction:column;gap:14px}
.side .panel{padding:18px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* own scroll indicator for the game bar: themed, no arrows, fades out when idle after first use */
.sbar{position:relative;height:6px;margin-top:6px;border-radius:3px;transition:opacity .45s ease;touch-action:none}
.sbar.idle{opacity:0}
.sbar[hidden]{display:none}
.sbar i{position:absolute;top:0;height:6px;border-radius:3px;background:var(--seat-line);cursor:grab}
.sbar:hover i,.sbar.drag i{background:var(--muted)}
.sbar.drag i{cursor:grabbing}
/* thin scrollbars in theme colours, no arrows */
.sb::-webkit-scrollbar{width:7px;height:7px}
.sb::-webkit-scrollbar-button{display:none;width:0;height:0}
.sb::-webkit-scrollbar-track{background:transparent}
.sb::-webkit-scrollbar-thumb{background:var(--seat-line);border-radius:4px}
.sb::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.sb::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){
  .sb{scrollbar-width:thin;scrollbar-color:var(--seat-line) transparent}
  .sb.sbauto{scrollbar-color:transparent transparent}
  .sb.sbauto:hover{scrollbar-color:var(--seat-line) transparent}
}
/* sbauto: the thumb only shows while the pointer is over the list */
.sb.sbauto::-webkit-scrollbar-thumb{background:transparent}
.sb.sbauto:hover::-webkit-scrollbar-thumb{background:var(--seat-line)}
.sb.sbauto:hover::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.chip small{display:block;font-size:11px;font-weight:500;opacity:.8}
svg.map{width:100%;max-width:720px;margin:0 auto;display:block;height:auto}
.mapwrap{position:relative}
.rp-track{position:relative}
.rp-track input{width:100%}
.rp-tick{position:absolute;bottom:-4px;width:2px;height:9px;margin-left:-1px;border-radius:1px;background:var(--ink);pointer-events:none;opacity:.8}
.rp-ev{display:block;width:100%;text-align:left;background:none;border:0;padding:3px 0;color:var(--ink);cursor:pointer;font:inherit}
.rp-ev:hover{text-decoration:underline}
.rp-ev.past{opacity:1} .rp-ev:not(.past){opacity:.55}
.map-expand{position:absolute;top:0;right:0;z-index:2}
.btn.icon{padding:8px;min-width:40px;min-height:40px;justify-content:center}
.btn.icon svg{width:20px;height:20px}
.mapfull{position:fixed;inset:0;z-index:55;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;gap:8px;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.mapfull[hidden]{display:none}
.mf-head{display:flex;align-items:center;gap:12px}
.mf-title{flex:1;min-width:0}
.mf-title .disp{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mf-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.mapfull svg.map{width:100%;height:100%;max-width:none;margin:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mapfull svg.map polygon{cursor:default}
.mf-legend .legend{justify-content:center;margin-top:0}
svg.map polygon{cursor:pointer;stroke:var(--line);stroke-width:2;vector-effect:non-scaling-stroke}
svg.map polygon.closed{cursor:default;fill:transparent;stroke-dasharray:6 5;stroke:var(--seat-line);stroke-width:1.5}
svg.map polygon.fan{fill:var(--fan);stroke:var(--line);stroke-width:2;cursor:pointer}
svg.map polygon.withdrawn{fill:transparent;stroke-dasharray:6 5;stroke:var(--muted);stroke-width:2}
svg.map polygon.stripes{pointer-events:none;stroke:none}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;vertical-align:middle;margin-left:6px;white-space:nowrap}
.tag.soldout{background:var(--accent);color:var(--accent-ink)}
.tag.closed{border:1px dashed var(--muted);color:var(--muted)}
.tag.fan{background:var(--fan);color:#fff}
.pchg{font-size:12px;font-weight:600;white-space:nowrap}
.pchg.up{color:var(--single)} .pchg.down{color:var(--season)}
.sw.striped{background:repeating-linear-gradient(45deg,var(--high) 0 3px,rgba(255,255,255,.55) 3px 5px)}
svg.map polygon.sel{stroke:var(--sel);stroke-width:3.5}
svg.map text{font:700 15px "Space Grotesk",Inter,sans-serif;pointer-events:none;text-anchor:middle;dominant-baseline:central}
svg.map text.halo{fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;font-size:14px}
svg.map.seatsmode polygon.fan{fill:var(--panel)}
svg.map #mapSeats{pointer-events:none}
.legend .sw.dot{border-radius:50%}
svg.map .dS{fill:var(--dot-s)} svg.map .dO,svg.map .dB{fill:var(--dot-o)} svg.map .dF{fill:var(--dot-f)}
svg.map .dA{fill:var(--dot-a);stroke:var(--dot-a-line);stroke-width:var(--dot-a-w)} svg.map .dC{fill:var(--closed);stroke:var(--seat-line);stroke-width:.6}
svg.seats rect{cursor:pointer}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}
tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chartwrap{position:relative;margin-top:10px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
svg.chart .ax{fill:var(--muted);font:12px Inter,sans-serif}
svg.chart .other{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.35}
svg.chart .other.hov{opacity:1;stroke:var(--ink);stroke-width:2}
svg.chart .hdot{fill:var(--ink);stroke:var(--panel);stroke-width:2}svg.chart .hdot.me{fill:var(--c2)}
svg.chart .over{cursor:crosshair}
svg.chart .me{fill:none;stroke:var(--c2);stroke-width:2.5;stroke-linejoin:round}
svg.chart .medot{fill:var(--c2);stroke:var(--panel);stroke-width:2}
svg.chart .lbl{fill:var(--ink);font:700 13px Inter,sans-serif}
svg.chart .ev{fill:var(--ink);stroke:var(--panel);stroke-width:1.5}
svg.chart .mebar{fill:var(--c2)}
svg.chart .xhair{stroke:var(--muted);stroke-width:1}
svg.chart .over{fill:transparent}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap}
.clegend{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;color:var(--muted)}
.clegend span{display:inline-flex;align-items:center;gap:6px}
.clegend .ln{width:18px;height:0;border-top:2.5px solid var(--c2)}.clegend .ln.other{border-top:1.5px solid var(--muted);opacity:.6}
.clegend .tri{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--ink)}
.clegend .sq{width:12px;height:12px;border-radius:3px}.sq.c1,.bar.c1{background:var(--c1)}.sq.c2,.bar.c2{background:var(--c2)}
.sel{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px;max-width:220px}
.evrow{padding:6px 0;border-top:1px solid var(--line)}.evrow:first-of-type{border-top:0}

.byrow .num{white-space:nowrap;text-align:right}
.minibar.wide{width:80px}
.smgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;margin-top:10px;align-items:start}
@media (max-width:760px){.smgrid{grid-template-columns:1fr}}
.replay input[type=range]{width:100%;accent-color:var(--accent)}
.zone{display:inline-flex;align-items:center;gap:6px}.zone i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.minibar{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;overflow:hidden}.minibar i{display:block;height:100%;background:var(--season)}
td button.link{cursor:pointer;border:0;background:none;padding:0;text-decoration:underline;font-weight:600}
.hist{display:flex;flex-direction:column;gap:4px;font-size:13px;max-height:180px;overflow:auto;padding-right:4px}
.hist.tall{max-height:min(70vh,640px)}
.hist div{display:flex;justify-content:space-between;gap:10px}
.note{font-size:12px;color:var(--muted)}

.warnbox{margin-top:8px;padding:10px 12px;border:1px solid var(--warn);border-radius:10px;font-size:12px;max-width:600px;color:var(--ink)}
.warnbox ul{margin:0 0 6px;padding-left:18px}.warnbox li{margin:2px 0}.warnbox a{color:var(--warn)}

@media (max-width:560px){.kpis>.kpi:last-child:nth-child(odd){grid-column:1/-1}h1{font-size:26px}.big{font-size:34px}.kpi .v{font-size:20px}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="title"></h1>
      <div class="small muted" id="updated"></div>
      <div class="warnbox" id="warnBox" hidden></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <div class="seg small-seg" role="group" aria-label="Language" id="langSeg"></div>
      <div class="seg small-seg" role="group" id="themeSeg"></div>
    </div>
  </header>

  <div class="controls">
    <div class="seg" role="group" id="tabSeg"></div>
    <div class="seg" role="group" id="whenSeg"></div>
  </div>

  <section class="kpis" id="kpis" aria-live="polite"></section>
  <main id="view"><div class="empty" data-t="loading"></div></main>
  <footer class="note" id="foot"></footer>
</div>

<div class="mapfull" id="mapFull" hidden role="dialog" aria-modal="true">
  <div class="mf-head">
    <div class="mf-title"><div class="disp" id="mfTitle"></div><div class="small muted" id="mfSub"></div></div>
    <button type="button" class="btn icon" id="mfX" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="mf-body" id="mfBody"></div>
  <div class="mf-legend" id="mfLegend"></div>
</div>

<div class="modal" id="shareModal" hidden role="dialog" aria-modal="true">
  <div class="modal-box">
    <div id="shareBody"></div>
    <button type="button" class="modal-x" id="shareX" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="modal-actions">
      <button type="button" class="btn primary" id="shareCopy"></button>
      <button type="button" class="btn" id="shareGo"></button>
      <a class="btn" id="shareDl" download></a>
    </div>
  </div>
</div>

<script>
"use strict";
const T = {
  lt: {
    title: "Ryto bilietai", eyebrow: "Vilniaus „Rytas“ · namų rungtynės · Arena Vilnius", loading: "Kraunama…",

const t = (k, vars) => { let s = (T[S.lang] || T.lt)[k] || k; for (const v in vars || {}) s = s.replace("{" + v + "}", vars[v]); return s; };

const fmt = (iso, o) => new Intl.DateTimeFormat(loc(), Object.assign({ timeZone: "Europe/Vilnius" }, o)).format(new Date(iso));
const dShort = (iso) => fmt(iso, { day: "numeric", month: "short" });

const dTime = (iso) => fmt(iso, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const pct = (a, b) => b ? (100 * a / b) : 0;

const gamesN = (n) => S.lang === "en" ? `${n} game${n === 1 ? "" : "s"}`
  : `${n} ${n % 10 === 0 || (n % 100 > 10 && n % 100 < 20) ? "rungtynių" : "rungtynės"}`;
// label point of a section outline: area-weighted centroid (a notch or an extra corner
// doesn't pull it toward the edge), the corner average if the outline is degenerate
function polyCenter(n){
  let A = 0, x = 0, y = 0;
  for (let i = 0; i < n.length; i++){
    const [x0, y0] = n[i], [x1, y1] = n[(i + 1) % n.length], c = x0 * y1 - x1 * y0;
    A += c; x += (x0 + x1) * c; y += (y0 + y1) * c;
  }
  if (Math.abs(A) < 1e-6) return [n.reduce((a, p) => a + p[0], 0) / n.length, n.reduce((a, p) => a + p[1], 0) / n.length];
  return [x / (3 * A), y / (3 * A)];
}
const vilniusDay = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Vilnius" }).format(d);
function daysTo(iso){
  const a = Date.parse(vilniusDay(new Date()) + "T00:00:00Z"), b = Date.parse(vilniusDay(new Date(iso)) + "T00:00:00Z");
  return Math.round((b - a) / 86400000);
}
function whenText(g){
  if (g.played) return t("playedLbl");
  const n = daysTo(g.start);
  return n <= 0 ? t("today") : n === 1 ? t("tomorrow") : t("inDays", { n: n });
}

function mix(a, b, f){
  const p = (h) => { const x = h.replace("#", ""); return [0, 2, 4].map((i) => parseInt(x.slice(i, i + 2), 16)); };
  const x = p(a), y = p(b); f = Math.max(0, Math.min(1, f));
  return "rgb(" + x.map((v, i) => Math.round(v + (y[i] - v) * f)).join(",") + ")";
}

}

// ---------------------------------------------------------------- insights tab
const DAY = 864e5;
function curveOf(g){                      // [[days before tip-off (<= 0), cumulative singles]]
  const start = new Date(g.start).getTime(), pts = (g.sales || []).map(([h, n]) => [(new Date(h).getTime() - start) / DAY, n]);
  if (!pts.length) return pts;
  const end = Math.min(0, (Date.now() - start) / DAY);
  if (end > pts[pts.length - 1][0]) pts.push([end, pts[pts.length - 1][1]]);   // flat to now / tip-off
  return pts.filter((p) => p[0] <= 0.01);
}
// game day: hours since local midnight (Vilnius) of the game's date, tickets sold since midnight
function localMidnight(iso){
  const d = new Date(iso), p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Vilnius", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(d).filter((x) => x.type !== "literal").map((x) => [x.type, Number(x.value)]));
  return d.getTime() - (p.hour * 60 + p.minute) * 6e4 - d.getSeconds() * 1e3 - d.getMilliseconds();
}
function soldBetween(g, a, b){            // single tickets sold in slots starting in [a, b) (ms)
  const pts = (g.sales || []).map(([h, n]) => [new Date(h).getTime() - 36e5, n]);
  if (!pts.length) return 0;
  let before = null, end = null;
  for (const [x, y] of pts){ if (x < a) before = y; if (x < b) end = y; }
  if (end == null) return 0;
  return Math.max(0, end - (before == null ? pts[0][1] : before));   // first point = sold before tracking
}
// Sold by clock hour from the game-day scans: scans start at irregular times (GitHub runs
// them 25-50 min late), so the tickets sold between two scans are spread evenly over the
// time between them and each clock hour gets its share (rounded on the running total).
function splitByHour(reads, mid, n){
  const r = reads.map(([t, v]) => [(new Date(t).getTime() - mid) / 36e5, v]);
  const at = (h) => {                      // tickets sold (since tracking) at hour h
    if (h <= r[0][0]) return r[0][1];
    for (let i = 1; i < r.length; i++){
      const [x0, y0] = r[i - 1], [x1, y1] = r[i];
      if (h <= x1) return y0 + (y1 - y0) * (x1 > x0 ? (h - x0) / (x1 - x0) : 1);
    }
    return r[r.length - 1][1];
  };
  const vals = [];
  for (let k = 0; k < n; k++) vals.push(Math.max(0, Math.round(at(k + 1)) - Math.round(at(k))));
  return vals;
}
function hourlyOf(g){                     // game day: [[hour, sold that hour] ...] as a step series, tip-off hour
  const mid = localMidnight(g.start), tip = (new Date(g.start).getTime() - mid) / 36e5;
  const nowH = (Date.now() - mid) / 36e5;
  if (nowH < 0 || !(g.sales || []).length) return { pts: [], vals: [], tip };
  const reads = (g.dayReads || []).filter((x) => x[0]);
  let vals = [];
  if (reads.length > 1){
    const lastH = (new Date(reads[reads.length - 1][0]).getTime() - mid) / 36e5;
    const n = Math.max(0, Math.min(Math.ceil(tip), Math.ceil(lastH)));
    vals = splitByHour(reads, mid, n);
  } else {                                 // no scan times recorded: whole scans per hour
    const n = Math.min(Math.ceil(tip), Math.ceil(nowH));
    for (let k = 0; k < n; k++) vals.push(soldBetween(g, mid + k * 36e5, mid + (k + 1) * 36e5));
  }
  const pts = vals.map((v, k) => [k, v]); if (vals.length) pts.push([vals.length, vals[vals.length - 1]]);
  return { pts, vals, tip };
}
function todayYesterday(g){
  const mid = localMidnight(new Date().toISOString());
  return { today: soldBetween(g, mid, Infinity), yesterday: soldBetween(g, mid - DAY, mid) };
}
function dayCurveOf(g){                   // [[hours since 00:00, sold since 00:00]], tip-off hour
  const mid = localMidnight(g.start), tip = (new Date(g.start).getTime() - mid) / 36e5;
  if (Date.now() < mid) return { pts: [], tip };
  const raw = (g.sales || []).map(([h, n]) => [new Date(h).getTime(), n]);
  if (!raw.length) return { pts: [], tip };
  let base = null; for (const [x, y] of raw){ if (x <= mid) base = y; else break; }
  const inDay = raw.filter(([x]) => x > mid).map(([x, y]) => [(x - mid) / 36e5, y]);
  if (base == null){ if (!inDay.length) return { pts: [], tip }; base = inDay[0][1]; }
  const pts = [[0, 0], ...inDay.filter(([h]) => h <= tip + 0.01).map(([h, y]) => [h, y - base])];
  const end = Math.min(tip, (Date.now() - mid) / 36e5);
  if (end > pts[pts.length - 1][0]) pts.push([end, pts[pts.length - 1][1]]);
  return { pts, tip };
}

function mapSvg(shapes, cell){        // cell(id) -> {fill, label, title, cls} or null (not drawn as data)
  const polys = shapes.map(([id, pts]) => { const c = cell(id);
    return `<polygon points="${esc(pts)}" fill="${c ? c.fill : cssVar("--closed")}" class="${c ? c.cls || "" : "closed"}">${c && c.title ? `<title>${esc(c.title)}</title>` : ""}</polygon>`; }).join("");
  const labels = shapes.map(([id, pts]) => { const c = cell(id); if (!c || !c.label) return "";
    const [cx, cy] = polyCenter(pts.split(" ").map((p) => p.split(",").map(Number)));
    return `<text x="${cx.toFixed(0)}" y="${cy.toFixed(0)}" fill="${c.ink}">${esc(c.label)}</text>`; }).join("");
  return `<svg class="map" viewBox="0 0 1000 1000" role="img">
    <rect x="390" y="170" width="225" height="430" rx="10" fill="none" stroke="var(--court)" stroke-width="3"></rect>
    <line x1="390" y1="385" x2="615" y2="385" stroke="var(--court)" stroke-width="2"></line>
    <circle cx="502" cy="385" r="38" fill="none" stroke="var(--court)" stroke-width="2"></circle>${polys}${labels}</svg>`;
}
function renderSalesMap(){
  if (replayTimer && S.smode !== "replay"){ clearInterval(replayTimer); replayTimer = null; }
  const gs = DATA.games.filter((g) => (g.sales || []).length).sort((a, b) => a.start.localeCompare(b.start));
  if (!gs.length){ $("view").innerHTML = `<div class="empty">${t("noData")}</div>`; return; }
  const sel = gs.find((g) => g.id === S.agame) || gs.find((g) => !g.played) || gs[gs.length - 1];
  S.agame = sel.id;
  const { scale, labelInk } = arenaColors(sel);
  const shapes = DATA.shapes[sel.conf] || [];
  const opts = gs.map((g) => `<option value="${esc(g.id)}"${g.id === sel.id ? " selected" : ""}>${esc(dShort(g.start) + " · " + g.opp)}</option>`).join("");
  const head = `<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">
      <div class="seg" role="group" id="smSeg"></div>
      ${S.smode === "replay" ? `<label class="small muted">${t("gameLbl")} <select id="smGame" class="sel">${opts}</select></label>` : ""}</div>`;
  if (S.smode === "popular"){
    const pop = DATA.popularity || {}, rows = Object.values(pop).filter((p) => p.fill != null);
    const byCount = S.pmode === "count";
    const val = (p) => byCount ? p.taken : p.fill;
    const hi = byCount ? Math.max(1, ...rows.map((p) => p.taken)) : 100;
    const nPlayed = Math.max(0, ...rows.map((p) => p.games));
    const next = DATA.games.filter((g) => !g.played).sort((a, b) => a.start.localeCompare(b.start))[0];
    const fmtV = (p) => byCount ? `${nf(p.taken)} / ${nf(p.seats)}` : `${p.fill.toFixed(0)}%`;
    const cell = (id) => { const p = pop[id]; if (!p || p.fill == null) return null; const fill = scale(val(p) / hi);
      return { fill, label: shortTitle(p.title), ink: labelInk(fill), title: `${p.title}: ${p.fill.toFixed(0)}% · ${t("avgTakenLbl")} ${nf(p.taken)} / ${nf(p.seats)} (${gamesN(p.games)})` }; };
    const top = rows.slice().sort((a, b) => val(b) - val(a)).slice(0, 10);
    const body = !rows.length
      ? `<div class="note" style="margin-top:12px">${t("popEmpty", { d: next ? dShort(next.start) + " (" + next.opp + ")" : "–" })}</div>`
      : `<div class="smgrid"><div>${mapSvg(shapes, cell)}
          <div class="legend"><span>${byCount ? "0" : "0%"}</span><span style="width:150px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--low),var(--mid),var(--high))"></span><span>${byCount ? nf(hi) + " " + t("seatsWord") : "100% " + t("takenWord")}</span></div></div>
        <div><h3 style="margin:0 0 6px;font-size:15px">${t("topSections")}</h3>${top.map((p) => `<div class="byrow small"><span>${esc(p.title)}</span><span class="minibar wide"><i style="width:${(100 * val(p) / hi).toFixed(0)}%"></i></span><span class="num">${fmtV(p)}</span></div>`).join("")}</div></div>`;
    $("view").innerHTML = `<div style="display:flex;flex-direction:column;gap:14px"><section class="panel" style="padding:14px 16px">${head}
      ${rows.length ? `<div class="seg small-seg" role="group" id="popSeg" style="margin-top:10px"></div>` : ""}
      ${body}
      ${rows.length ? `<p class="note" style="margin:8px 0 0">${t(byCount ? "popNoteCount" : "popNoteFill", { n: gamesN(nPlayed) })}</p>` : ""}</section></div>`;
    if (rows.length) segButtons($("popSeg"), [["fill", t("popFill")], ["count", t("popCount")]], byCount ? "count" : "fill", (v) => { S.pmode = v; render(); }, t("popular"));
  } else {
    $("view").innerHTML = `<div style="display:flex;flex-direction:column;gap:14px"><section class="panel" style="padding:14px 16px">${head}
      <div id="smBody" class="note" style="margin-top:10px">…</div></section></div>`;
    loadSeats(sel.id).then((seats) => {
      if (S.tab !== "salesmap" || S.smode !== "replay" || S.agame !== sel.id) return;
      const t1 = Math.min(Date.now(), new Date(sel.start).getTime()), first = new Date(sel.dataFrom || sel.sales[0][0]).getTime();
      const rr = ["7", "14", "30", "all"].includes(S.rrange) ? S.rrange : "14";
      const t0 = rr === "all" ? first : Math.max(first, t1 - Number(rr) * DAY);
      const hours = Math.max(1, Math.round((t1 - t0) / 36e5));
      if (S.replayT == null || S.replayT > hours || S.replayWin !== rr) S.replayT = hours;
      S.replayWin = rr;
      const secsById = {}; (DATA.sections[sel.id] || []).forEach((x) => { secsById[x.id] = x; });
      const fanIds = new Set((sel.fanSections || []).map((f) => f.id));
      // sections that opened (or closed) after tracking began, grouped by the hour they changed
      const evs = {};
      for (const x of DATA.sections[sel.id] || []){
        if (x.openedLater){ const k = x.openedLater.slice(0, 13); (evs[k] = evs[k] || { t: new Date(x.openedLater).getTime(), open: [], shut: [] }).open.push(shortTitle(x.title)); }
        if (x.status === "closed" && x.closedAt){ const k = x.closedAt.slice(0, 13); (evs[k] = evs[k] || { t: new Date(x.closedAt).getTime(), open: [], shut: [] }).shut.push(shortTitle(x.title)); }
      }
      const evList = Object.values(evs).filter((e) => e.t >= t0 && e.t <= t1).sort((a, b) => a.t - b.t);
      const natSort = (arr) => arr.sort((a, b) => a.localeCompare(b, "lt", { numeric: true })).join(", ");
      const draw = () => {
        const T = t0 + S.replayT * 36e5;
        let soldThen = 0;
        const share = {};
        for (const [sid, list] of Object.entries(seats)){
          let n = 0, k = 0;
          for (const q of list){ const cat = q[4]; if (cat === "X") continue; n++;
            const taken = cat === "S" || cat === "F" || cat === "B" || (cat === "O" && q[7] && new Date(q[7]).getTime() <= T);
            if (taken) k++; if (cat === "B" || (cat === "O" && taken)) soldThen++; }
          if (n) share[sid] = k / n;
        }
        const offAt = (x) => !!x && ((x.openedLater && T < new Date(x.openedLater).getTime()) ||
          (x.status === "closed" && x.closedAt && T >= new Date(x.closedAt).getTime()));
        for (const [sid, list] of Object.entries(seats)){                       // seats of a section not yet on sale don't count
          const x = secsById[sid]; if (!offAt(x)) continue;
          for (const q of list) if (q[4] === "O" && q[7] && new Date(q[7]).getTime() <= T) soldThen--;
        }
        const cell = (id) => { if (fanIds.has(id)) return { fill: cssVar("--fan"), label: "", cls: "fan" };
          if (offAt(secsById[id])) return null;                                 // drawn as not on sale (dashed)
          if (share[id] == null) return null; const fill = scale(share[id]);
          const x = secsById[id]; return { fill, label: x ? shortTitle(x.title) : "", ink: labelInk(fill), title: `${x ? x.title : id}: ${(100 * share[id]).toFixed(0)}%` }; };
        $("smMap").innerHTML = mapSvg(shapes, cell);
        document.querySelectorAll("#smOpen [data-t]").forEach((el) => el.classList.toggle("past", Number(el.dataset.t) <= T));
        $("smWhen").textContent = dTime(new Date(T).toISOString());
        $("smSold").textContent = t("soldByThen", { n: nf(soldThen) });
      };
      $("smBody").className = "";
      $("smBody").innerHTML = `<div class="smgrid"><div><div id="smMap"></div>
          <div class="legend"><span>0%</span><span style="width:150px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--low),var(--mid),var(--high))"></span><span>100% ${t("takenWord")}</span>${sel.fans ? `<span><i class="sw" style="background:var(--fan)"></i>${FAN}</span>` : ""}</div></div>
        <div class="replay"><div class="seg small-seg" role="group" id="rpRange" style="margin-bottom:12px"></div>
          <div class="small muted">${t("replayAt")}</div><div class="disp" style="font-size:20px;font-weight:700" id="smWhen"></div>
          <div class="small" id="smSold" style="margin:2px 0 10px"></div>
          <div class="rp-track"><input type="range" id="smRange" min="0" max="${hours}" step="1" value="${S.replayT}" aria-label="${esc(t("replayAt"))}">
            ${evList.map((e) => `<i class="rp-tick" style="left:${(100 * (e.t - t0) / (t1 - t0)).toFixed(2)}%" title="${esc(dTime(new Date(e.t).toISOString()))}"></i>`).join("")}</div>
          <div style="display:flex;justify-content:space-between" class="small muted"><span>${esc(dTime(new Date(t0).toISOString()))}</span><span>${esc(dTime(new Date(t1).toISOString()))}</span></div>
          <button type="button" class="btn" id="smPlay" style="margin-top:10px">${replayTimer ? t("pause") : t("play")}</button>
          ${evList.length ? `<div id="smOpen" style="margin-top:14px"><div class="small" style="font-weight:600;margin-bottom:4px">${t("openings")}</div>
            ${evList.map((e) => `<button type="button" class="rp-ev small" data-t="${e.t}"><span class="muted">${esc(dTime(new Date(e.t).toISOString()))}</span> · ${e.open.length ? `${esc(natSort(e.open))} <span class="muted">${t("openedNow")}</span>` : ""}${e.open.length && e.shut.length ? "; " : ""}${e.shut.length ? `${esc(natSort(e.shut))} <span class="muted">${t("closedNow")}</span>` : ""}</button>`).join("")}</div>` : ""}
          <p class="note" style="margin:10px 0 0">${evList.length ? t("replayNote2") : ""}${t("replayNote")}</p></div></div>`;
      draw();
      segButtons($("rpRange"), [["7", "7 " + t("daysShort")], ["14", "14 " + t("daysShort")], ["30", "30 " + t("daysShort")], ["all", t("rangeAll")]], rr,
        (v) => { S.rrange = v; store.set("rrange", v); if (replayTimer){ clearInterval(replayTimer); replayTimer = null; } render(); }, t("replay"));
      $("smRange").oninput = (e) => { S.replayT = Number(e.target.value); draw(); };
      document.querySelectorAll("#smOpen [data-t]").forEach((el) => el.addEventListener("click", () => {   // jump to that hour
        if (replayTimer){ clearInterval(replayTimer); replayTimer = null; $("smPlay").textContent = t("play"); }
        S.replayT = Math.min(hours, Math.max(0, Math.ceil((Number(el.dataset.t) - t0) / 36e5))); $("smRange").value = S.replayT; draw(); }));
      $("smPlay").onclick = () => {
        if (replayTimer){ clearInterval(replayTimer); replayTimer = null; $("smPlay").textContent = t("play"); return; }
        if (S.replayT >= hours) S.replayT = 0;
        const stepH = Math.max(1, Math.round(hours / 60));
        replayTimer = setInterval(() => {
          if (S.tab !== "salesmap" || !$("smRange")){ clearInterval(replayTimer); replayTimer = null; return; }
          S.replayT = Math.min(hours, S.replayT + stepH); $("smRange").value = S.replayT; draw();
          if (S.replayT >= hours){ clearInterval(replayTimer); replayTimer = null; $("smPlay").textContent = t("play"); }
        }, 120);
        $("smPlay").textContent = t("pause");
      };
    });
  }
  segButtons($("smSeg"), [["replay", t("replay")], ["popular", t("popular")]], S.smode, (v) => { S.smode = v; render(); }, t("salesMapTab"));
  const gsel = $("smGame"); if (gsel) gsel.onchange = (e) => { S.agame = e.target.value; S.replayT = null; render(); };
}

  const cards = [
    [t("msSeats"), nf(m.total), t("msSeatsSub")],
    [t("msRevenue"), S.lang === "en" ? `€${nf(Math.round(m.low / 1000))}k–€${nf(Math.round(m.high / 1000))}k`

  const gs = listGames();
  const next = DATA.games.filter((g) => !g.played).sort((a, b) => a.start < b.start ? -1 : 1)[0];
  const singles = gs.reduce((s, g) => s + g.singles, 0), rev = gs.reduce((s, g) => s + (g.revenue || 0), 0), gross = gs.reduce((s, g) => s + (g.gross || 0), 0);
  const k = [
    [t("nextGame"), next ? next.opp : "–", next ? dFull(next.start) + " · " + whenText(next) + " · " + nf(expectedOf(next)) + " " + t("expected") : ""],
    [t("seasonSeats"), nf(DATA.seasonSeats), t("seasonSub", { n: DATA.games.length })],
    [t("singlesSold"), nf(singles), (S.when === "played" ? t("played") : t("upcoming")) + " · " + gamesN(gs.length)],
    [t("clubRevenue"), eur(rev), t("clubRevenueSub")],
    [t("avgValue"), singles ? eur(gross / singles, 2) : "–", singles ? t("avgValueSub", { p: eur(rev / singles, 2) }) : ""]

}

function renderGames(){
  let gs = listGames().filter((g) => S.comp === "all" || g.comp === S.comp);
  const key = { date: (g) => g.start, singles: (g) => -g.singles, revenue: (g) => -(g.revenue || 0), avg: (g) => -(g.avgPaid || 0) }[S.sort];
  gs.sort((a, b) => { const x = key(a), y = key(b); return x < y ? -1 : x > y ? 1 : 0; });
  if (S.when === "played" && S.sort === "date") gs.reverse();
  const comps = ["all"].concat([...new Set(DATA.games.map((g) => g.comp))].sort());
  const cards = gs.map((g) => {
    const has = g.seats > 0;
    const att = g.played ? (g.attendance != null
      ? `<div class="small"><b class="num">${t("attendance")}: ${nf(g.attendance)}</b> <span class="muted">· ${t("attVs", { e: nf(expectedOf(g)) })} (${(g.attendance - expectedOf(g) >= 0 ? "+" : "") + nf(g.attendance - expectedOf(g))})</span></div>`
      : `<div class="small muted">${t("noAtt")}</div>`) : "";
    return `<article class="panel card"><button type="button" class="card-open" data-game="${esc(g.id)}" aria-label="${esc(t("arena") + ": " + g.opp)}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="badge ${esc(g.comp)}">${esc(g.comp)}</span><span class="small muted">${esc(dFull(g.start))}</span></div>
      <div class="card-head"><div class="small muted">${t("vs")}</div><div class="opp">${esc(g.opp)}</div><div class="small muted">${esc(whenText(g))}</div></div>
      ${has ? `<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="big num">${nf(expectedOf(g))}</span><span class="small muted">${t("expected")}</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${pct(g.season, g.seats + (g.fans || 0))}%;background:var(--season)"></i><i style="width:${pct(g.fans || 0, g.seats + (g.fans || 0))}%;background:var(--fan)"></i><i style="width:${pct(g.singles, g.seats + (g.fans || 0))}%;background:var(--single)"></i></div>
      ${g.fans ? `<div class="small muted" style="margin-top:-6px">${esc(t("fanPart", { n: nf(expectedOf(g) - g.fans) }))}</div>` : ""}
      <div class="grid2"><div><span class="muted">${t("singles")}</span><b class="num">${nf(g.singles)}</b></div><div><span class="muted">${t("available")}</span><b class="num">${nf(g.available)}</b></div>
      <div><span class="muted">${t("revenue")}</span><b class="num">${eur(g.revenue)}</b></div><div><span class="muted">${t("avg")}</span><b class="num">${g.singles ? eur(g.avgPaid, 2) : "–"}</b></div></div>
      ` : `<div class="small muted">${t("noData")}</div>`}
      ${att}
    </button>
    <div class="card-foot"><span class="small muted">${has ? (g.played ? t("seen", { n: nf(g.seen) }) : trend24(g)) : ""}</span>
      <button type="button" class="btn" data-share="${esc(g.id)}" aria-label="${esc(t("share") + ": " + g.opp)}">${ICON_SHARE}<span>${t("share")}</span></button></div>

  $("view").innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">

      <div class="seg small-seg" role="group" id="compSeg"></div>

    </div>
    <div class="legend"><span><i class="sw" style="background:var(--season)"></i>${t("legendSeason")}</span><span><i class="sw" style="background:var(--fan)"></i>${FAN}</span><span><i class="sw" style="background:var(--single)"></i>${t("legendSingle")}</span><span><i class="sw" style="background:var(--free);border-color:var(--line)"></i>${t("legendFree")}</span></div>
    ${gs.length ? `<div class="cards">${cards}</div>` : `<div class="panel empty">${t("noGames")}</div>`}
  </div>`;
  segButtons($("compSeg"), comps.map((c) => [c, c === "all" ? t("all") : c]), S.comp, (v) => { S.comp = v; renderGames(); });
  segButtons($("sortSeg"), [["date", t("byDate")], ["singles", t("bySingles")], ["revenue", t("byRevenue")], ["avg", t("byAvg")]], S.sort, (v) => { S.sort = v; renderGames(); }, t("sort"));

}

function sectionValue(s){
  const seats = s.seats || 1;
  if (S.mode === "price") return s._p;
  return (s.season + s.singles) / seats;
}

// colours of the arena map for one game (also used by the share picture)
function arenaColors(g){
  const secs = DATA.sections[g.id] || [];
  const byId = {}; secs.forEach((s) => { byId[s.id] = s; });
  const prices = secs.map((s) => s.price || 0).filter((p) => p > 0);
  // VIP boxes and Parteris (189 / 89 EUR vs 8-65 EUR) are left out of the price scale, so the regular sections stay
  // distinguishable; anything dearer than the scale's top gets the top colour ("43 EUR+")
  const scaled = secs.filter((s) => s.price > 0 && !/\bVIP\b|parter/i.test(s.title || "")).map((s) => s.price);
  const ref = scaled.length ? scaled : prices;
  const top = Math.max(...ref, 1), over = prices.some((p) => p > top);
  const lo = Math.log(Math.min(...ref, 1e9)), hi = Math.log(top);
  secs.forEach((s) => { s._p = s.price && hi > lo ? Math.min(1, Math.max(0, (Math.log(s.price) - lo) / (hi - lo))) : 0; });
  const low = cssVar("--low"), mid = cssVar("--mid"), high = cssVar("--high"), closed = cssVar("--closed");
  const scale = (f) => f < 0.5 ? mix(low, mid, f * 2) : mix(mid, high, (f - 0.5) * 2);
  const labelInk = (fill) => { const rgb = fill.match(/\d+/g).map(Number); return (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255 > 0.55 ? "#1A1208" : "#FFFFFF"; };
  const legend = S.mode === "price" ? [t("cheap"), eur(top) + (over ? "+" : "")] : ["0%", "100% " + t("takenWord")];
  return { secs, byId, prices, scale, closed, labelInk, legend, shapes: DATA.shapes[g.conf] || [] };
}

// keep the game bar where it was, then slide so the selected game is in the middle
function centerChip(prevLeft){
  const bar = $("chips"); if (!bar) return;
  const chip = bar.querySelector('.chip[aria-pressed="true"]'); if (!chip) return;
  bar.style.scrollBehavior = "auto"; bar.scrollLeft = prevLeft || 0;
  if (prevLeft != null && S._centered === S.game) return;   // same game (e.g. a section was picked): keep the bar where it is
  S._centered = S.game;
  const target = chip.offsetLeft - bar.offsetLeft - (bar.clientWidth - chip.offsetWidth) / 2;
  bar._auto = Date.now();
  requestAnimationFrame(() => { bar.style.scrollBehavior = ""; bar.scrollTo({ left: Math.max(0, target), behavior: prevLeft == null ? "auto" : "smooth" }); });
}

// game bar scroll indicator: visible until first used; afterwards it fades out when idle
// and comes back while scrolling or when the pointer is over the bar. Draggable.
function scrollIndicator(el, bar, thumb, key){
  if (!el || !bar) return;
  S.sbUsed = S.sbUsed || {};
  let timer;
  const geo = () => { const tw = bar.clientWidth, ratio = el.clientWidth / el.scrollWidth, w = Math.max(36, tw * ratio); return { tw, w, max: el.scrollWidth - el.clientWidth }; };
  const update = () => {
    const { tw, w, max } = geo();
    bar.hidden = max <= 1;
    thumb.style.width = w + "px";
    thumb.style.left = (max > 0 ? (el.scrollLeft / max) * (tw - w) : 0) + "px";
  };
  const show = () => { bar.classList.remove("idle"); clearTimeout(timer); if (S.sbUsed[key]) timer = setTimeout(() => { if (!bar.classList.contains("drag")) bar.classList.add("idle"); }, 1200); };
  const used = () => { S.sbUsed[key] = true; show(); };
  if (S.sbUsed[key]) bar.classList.add("idle");
  el.addEventListener("scroll", () => { update(); if (!(el._auto && Date.now() - el._auto < 700)) used(); }, { passive: true });
  [el, bar].forEach((n) => n.addEventListener("pointermove", () => { if (S.sbUsed[key]) show(); }, { passive: true }));
  // drag the thumb, or click the track to jump
  let drag = null;
  bar.addEventListener("pointerdown", (e) => {
    const { tw, w, max } = geo(), r = bar.getBoundingClientRect();
    if (e.target !== thumb) el.scrollLeft = ((e.clientX - r.left - w / 2) / (tw - w)) * max;
    drag = { x: e.clientX, left: el.scrollLeft, k: max / Math.max(1, tw - w) };
    bar.setPointerCapture(e.pointerId); bar.classList.add("drag"); used(); e.preventDefault();
  });
  bar.addEventListener("pointermove", (e) => { if (drag) el.scrollLeft = drag.left + (e.clientX - drag.x) * drag.k; });
  const end = () => { drag = null; bar.classList.remove("drag"); show(); };
  bar.addEventListener("pointerup", end); bar.addEventListener("pointercancel", end);
  if (window._sbResize) window.removeEventListener("resize", window._sbResize);
  window._sbResize = update; window.addEventListener("resize", update);
  if (!window._chartResize){         // the insights chart is drawn at the real width: redraw on resize
    let tm; window._chartResize = true;
    window.addEventListener("resize", () => { clearTimeout(tm); tm = setTimeout(() => { if (S.tab === "analysis") render(); }, 200); });
  }
  update();
}

// sold out: every seat taken (season tickets + single) or the price list says so; not for closed sections
function isSoldOut(s){ return !!s && s.status !== "closed" && (s.status === "soldout" || (s.seats > 0 && s.available === 0)); }
function statusTag(s){
  if (isSoldOut(s)) return ` <span class="tag soldout">${t("soldOut")}</span>`;
  if (s.status === "closed") return ` <span class="tag closed">${t("closedSec")}</span>`;
  return "";
}

// ▲/▼ against the first logged price, for the sections table
function priceChg(s){
  const h = s.history || [];
  if (h.length < 2 || s.price == null || h[0][1] === s.price) return "";
  const up = s.price > h[0][1], last = h[h.length - 1][0];
  return `<span class="pchg ${up ? "up" : "down"}" title="${esc(t("priceFrom", { p: eur(h[0][1]), d: dShort(last) }))}">${up ? "▲" : "▼"}</span>`;
}

// price history card: first -> now summary, then every change (newest first) with its direction
function priceHistoryHtml(s){
  const zs = (s.zones || []).filter((z) => z.history && z.history.length);
  // several price levels on sale at once: one history per level, open ones first; otherwise one
  // history of the price on sale (a level replaced by a dearer one shows as a price change)
  if (zs.length > 1 && zs.filter((z) => z.open).length > 1)
    return zs.slice().sort((a, b) => (b.open - a.open) || (a.price - b.price))
      .map((z) => `<div style="font-weight:600;margin-top:8px">${esc(z.name)}${z.open ? "" : ` <span class="tag soldout">${t("soldOut")}</span>`}</div>${historyRows(z.history)}`).join("");
  return historyRows(s.history || []);
}

function historyRows(h){
  if (!h.length) return "";
  if (h.length === 1) return `<div class="muted">${h[0][3] ? esc(h[0][3]) + " · " : ""}${t("unchanged", { d: dTime(h[0][0]) })}</div>`;
  const first = h[0][1], now = h[h.length - 1][1], diff = now - first;
  const head = diff ? `<div class="pchg ${diff > 0 ? "up" : "down"}" style="font-size:13px">${diff > 0 ? "▲" : "▼"} ${esc(t("priceSummary", { a: eur(first), b: eur(now), d: (diff > 0 ? "+" : "−") + eur(Math.abs(diff)) }))}</div>`
                    : `<div class="muted">${esc(t("priceBack", { a: eur(first) }))}</div>`;
  const named = h.some((x) => x[3]);        // the price level (bilietai.lt name) on every row
  const rows = h.map((x, i) => {
    const prev = i ? h[i - 1][1] : null, arrow = prev == null ? "" : x[1] > prev ? "▲" : x[1] < prev ? "▼" : "";
    return `<div><span class="muted">${esc(dTime(x[0]))}${named ? ` · ${esc(x[3])}` : ""}</span><span class="num">${arrow ? `<span class="pchg ${x[1] > prev ? "up" : "down"}">${arrow}</span> ` : ""}${eur(x[1])} <span class="muted">(${t("value").toLowerCase()} ${eur(x[1] - x[2])})</span></span></div>`;
  }).reverse().join("");
  return head + rows;
}

// ticket value / fee of a section; a range when its open zones differ
function openZones(s){ return (s.zones || []).filter((z) => z.open); }
function valueRange(s){
  const v = openZones(s).map((z) => z.price - (z.fee || 0));
  if (v.length < 2 || Math.min(...v) === Math.max(...v)) return eur(s.price - (s.fee || 0));
  return eur(Math.min(...v)) + "–" + eur(Math.max(...v));
}
function feeRange(s){
  const f = openZones(s).map((z) => z.fee || 0);
  if (f.length < 2 || Math.min(...f) === Math.max(...f)) return eur(s.fee);
  return eur(Math.min(...f)) + "–" + eur(Math.max(...f));
}

// Seat view of the arena map. Seat positions come from each section's own seat plan (its own
// coordinates), so every section's seats are fitted into its shape on the map: turned so that
// row 1 faces the court, stretched to the shape, then shrunk until every seat is inside it.
const COURT = { x0: 390, x1: 615, y0: 170, y1: 600 };   // the court on the map
function inPoly(x, y, n){
  let c = false;
  for (let i = 0, j = n.length - 1; i < n.length; j = i++){
    const [xi, yi] = n[i], [xj, yj] = n[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
// smallest rectangle around a shape: its two axes (the shape's own orientation)
function rectAxes(n){
  const p = n.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]), cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], hi = [];
  for (const q of p){ while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (const q of p.slice().reverse()){ while (hi.length > 1 && cr(hi[hi.length - 2], hi[hi.length - 1], q) <= 0) hi.pop(); hi.push(q); }
  const h = lo.slice(0, -1).concat(hi.slice(0, -1));
  let best = null;
  for (let i = 0; i < h.length; i++){

async function openShare(gid, kind){

  $("shareX").setAttribute("aria-label", t("close"));

  share.file = new File([blob], name, { type: "image/png" });
  $("shareBody").innerHTML = `<img src="${share.url}" alt="${esc(g.opp + " · " + nf(expectedOf(g)) + " " + t("expected"))}">`;

$("shareX").addEventListener("click", () => closeShare());
$("shareModal").addEventListener("click", (e) => { if (e.target === $("shareModal")) closeShare(); });   // tap outside
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && share.open) closeShare(); else if (e.key === "Escape" && full.open) closeMapFull(); });
window.addEventListener("popstate", () => { if (share.open) closeShare(true); if (full.open) closeMapFull(true); });
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && full.open) closeMapFull(); });   // left full screen with the system key
$("mfX").addEventListener("click", () => closeMapFull());

// ---------------------------------------------------------------- start
setTheme();
render();
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (S.theme === "auto") render(); });
fetch("data.json", { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => {
  DATA = d;
  if (!DATA.games.some((g) => !g.played)) S.when = "played";
  if (S.game){ const g = DATA.games.find((x) => x.id === S.game); if (g) S.when = g.played ? "played" : "upcoming"; }
  render();
}).catch(() => { $("view").innerHTML = `<div class="err">${esc(t("loadErr"))}</div>`; });
</script>
</body>
</html>
