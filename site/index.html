<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryto bilietai</title>
<meta name="description" content="Vilniaus „Ryto“ namų rungtynių bilietų pardavimai, abonementai ir arenos planas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Crect x='7' y='9' width='18' height='14' rx='2' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* light: cream and brown; sand for free seats */
:root{
  --bg:#F6EFE2; --panel:#FFFAF0; --ink:#2A1C11; --muted:#6B5644; --line:#E2D3BA;
  --accent:#7B4A23; --accent-ink:#FFF8EC; --season:#6F6052; --single:#C47A2C; --free:#F6EFE2; --seat-line:#B8A386;
  --closed:#EFE5D2; --low:#F0E2C8; --mid:#CF9F67; --high:#7B4A23; --court:#D8C7A8; --focus:#7B4A23; --bcl:#2E5C8A; --sel:#C47A2C; --avail:#E2C79C; --fan:#8E3B46; --warn:#B4532A; --c1:#008C80; --c2:#C7701A;
  color-scheme: light;
}
/* dark: charcoal with amber; teal for the data (as in light) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1C1E; --panel:#232528; --ink:#ECE9E3; --muted:#A6A39C; --line:#36393D;
    --accent:#E0A458; --accent-ink:#1B1C1E; --season:#3F8F88; --single:#E0A458; --free:#2A2D30; --seat-line:#5A5E63;
    --closed:#232528; --low:#2C3432; --mid:#245F59; --high:#2A9D8F; --court:#45494E; --focus:#F0C27F; --bcl:#9DB8D9; --sel:#F4EEDC; --avail:#D9DDD4; --fan:#9C83C9; --warn:#F0A35E; --c1:#12A193; --c2:#D27B27;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1C1E; --panel:#232528; --ink:#ECE9E3; --muted:#A6A39C; --line:#36393D;
  --accent:#E0A458; --accent-ink:#1B1C1E; --season:#3F8F88; --single:#E0A458; --free:#2A2D30; --seat-line:#5A5E63;
  --closed:#232528; --low:#2C3432; --mid:#245F59; --high:#2A9D8F; --court:#45494E; --focus:#F0C27F; --bcl:#9DB8D9; --sel:#F4EEDC; --avail:#D9DDD4; --fan:#9C83C9; --warn:#F0A35E; --c1:#12A193; --c2:#D27B27;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:"Space Grotesk",Inter,sans-serif}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible,polygon:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:20px}
.muted{color:var(--muted)}
.small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-size:32px;letter-spacing:-.01em}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--panel);border:1px solid var(--line);flex-wrap:wrap}
.seg button,.chip{cursor:pointer;border:1px solid transparent;background:transparent;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.small-seg button{padding:5px 9px;font-size:12px}
.chip{border-color:var(--line);text-align:left}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
@media (max-width:420px){.hide-xs{display:none}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .v{font-family:"Space Grotesk",Inter,sans-serif;font-size:24px;font-weight:700;overflow-wrap:anywhere}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid transparent}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;border-radius:18px;overflow:hidden}
.card:hover{border-color:var(--accent)}
.card-open{cursor:pointer;text-align:left;padding:20px 20px 10px;display:flex;flex-direction:column;gap:14px;background:none;border:0;width:100%;color:inherit;font:inherit}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px 14px 20px;margin-top:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;min-height:40px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn svg{width:17px;height:17px;flex:none}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal-box{position:relative;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:20px;overflow:hidden;
  --ar:0.86; width:min(400px, 100%, calc((100vh - 110px) * var(--ar)));display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-box img{width:100%;height:auto;display:block}
.modal-x{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.modal-x:hover{border-color:var(--accent)}
.modal-x svg{width:16px;height:16px}
.modal-actions{display:flex;gap:8px;padding:0 16px 16px}
.modal-actions .btn{flex:1 1 0;padding:8px 10px;min-width:0}
.modal-actions .btn[hidden]{display:none}
.modal-actions .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:440px){.modal-actions .btn{flex-direction:column;gap:4px;font-size:12px;min-height:58px;padding:8px 4px}.modal-actions{gap:6px;padding:0 12px 12px}}
.seatwrap{overflow:auto;max-height:440px}
.seatwrap svg{display:block;margin:0 auto}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:5px;border:1px solid currentColor}
.badge.LKL{color:var(--accent)} .badge.BCL{color:var(--bcl)}
.opp{font-family:"Space Grotesk",Inter,sans-serif;font-size:22px;font-weight:700;line-height:1.15}
@media (min-width:620px){.card-head{min-height:94px}}
.big{font-family:"Space Grotesk",Inter,sans-serif;font-size:40px;font-weight:700;line-height:1}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--free);border:1px solid var(--line)}
.bar i{display:block;height:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;font-size:13px}
.grid2 b{display:block;font-family:"Space Grotesk",Inter,sans-serif;font-size:17px}
.arena{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.mapbox{flex:3 1 520px;min-width:0;padding:16px;display:flex;flex-direction:column;gap:12px}
.side{flex:2 1 340px;min-width:0;display:flex;flex-direction:column;gap:14px}
.side .panel{padding:18px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* own scroll indicator for the game bar: themed, no arrows, fades out when idle after first use */
.sbar{position:relative;height:6px;margin-top:6px;border-radius:3px;transition:opacity .45s ease;touch-action:none}
.sbar.idle{opacity:0}
.sbar[hidden]{display:none}
.sbar i{position:absolute;top:0;height:6px;border-radius:3px;background:var(--seat-line);cursor:grab}
.sbar:hover i,.sbar.drag i{background:var(--muted)}
.sbar.drag i{cursor:grabbing}
/* thin scrollbars in theme colours, no arrows */
.sb::-webkit-scrollbar{width:7px;height:7px}
.sb::-webkit-scrollbar-button{display:none;width:0;height:0}
.sb::-webkit-scrollbar-track{background:transparent}
.sb::-webkit-scrollbar-thumb{background:var(--seat-line);border-radius:4px}
.sb::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.sb::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){
  .sb{scrollbar-width:thin;scrollbar-color:var(--seat-line) transparent}
}
.chip small{display:block;font-size:11px;font-weight:500;opacity:.8}
svg.map{width:100%;max-width:720px;margin:0 auto;display:block;height:auto}
svg.map polygon{cursor:pointer;stroke:var(--line);stroke-width:2;vector-effect:non-scaling-stroke}
svg.map polygon.closed{cursor:default;fill:transparent;stroke-dasharray:6 5;stroke:var(--seat-line);stroke-width:1.5}
svg.map polygon.fan{fill:var(--fan);stroke:var(--line);stroke-width:2;cursor:pointer}
svg.map polygon.withdrawn{fill:transparent;stroke-dasharray:6 5;stroke:var(--muted);stroke-width:2}
svg.map polygon.stripes{pointer-events:none;stroke:none}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;vertical-align:middle;margin-left:6px;white-space:nowrap}
.tag.soldout{background:var(--accent);color:var(--accent-ink)}
.tag.closed{border:1px dashed var(--muted);color:var(--muted)}
.tag.fan{background:var(--fan);color:#fff}
.pchg{font-size:12px;font-weight:600;white-space:nowrap}
.pchg.up{color:var(--single)} .pchg.down{color:var(--season)}
.sw.striped{background:repeating-linear-gradient(45deg,var(--high) 0 3px,rgba(255,255,255,.55) 3px 5px)}
svg.map polygon.sel{stroke:var(--sel);stroke-width:3.5}
svg.map text{font:700 15px "Space Grotesk",Inter,sans-serif;pointer-events:none;text-anchor:middle;dominant-baseline:central}
svg.seats rect{cursor:pointer}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}
tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chartwrap{position:relative;margin-top:10px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
svg.chart .ax{fill:var(--muted);font:12px Inter,sans-serif}
svg.chart .other{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.35}
svg.chart .other.hov{opacity:1;stroke:var(--ink);stroke-width:2}
svg.chart .hdot{fill:var(--ink);stroke:var(--panel);stroke-width:2}svg.chart .hdot.me{fill:var(--c2)}
svg.chart .over{cursor:crosshair}
svg.chart .me{fill:none;stroke:var(--c2);stroke-width:2.5;stroke-linejoin:round}
svg.chart .medot{fill:var(--c2);stroke:var(--panel);stroke-width:2}
svg.chart .lbl{fill:var(--ink);font:700 13px Inter,sans-serif}
svg.chart .ev{fill:var(--ink);stroke:var(--panel);stroke-width:1.5}
svg.chart .xhair{stroke:var(--muted);stroke-width:1}
svg.chart .over{fill:transparent}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap}
.clegend{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;color:var(--muted)}
.clegend span{display:inline-flex;align-items:center;gap:6px}
.clegend .ln{width:18px;height:0;border-top:2.5px solid var(--c2)}.clegend .ln.other{border-top:1.5px solid var(--muted);opacity:.6}
.clegend .tri{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--ink)}
.clegend .sq{width:12px;height:12px;border-radius:3px}.sq.c1,.bar.c1{background:var(--c1)}.sq.c2,.bar.c2{background:var(--c2)}
.sel{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px;max-width:220px}
.evrow{padding:6px 0;border-top:1px solid var(--line)}.evrow:first-of-type{border-top:0}
.evbars{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;margin-top:4px}
.evbars .bar{display:block;height:10px;border-radius:0 4px 4px 0;min-width:2px}
.bygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.byrow{display:grid;grid-template-columns:1fr 80px 52px;gap:8px;align-items:center;padding:2px 0}
.minibar.wide{width:80px}
.smgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;margin-top:10px;align-items:start}
@media (max-width:760px){.smgrid{grid-template-columns:1fr}}
.replay input[type=range]{width:100%;accent-color:var(--accent)}
.zone{display:inline-flex;align-items:center;gap:6px}.zone i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.minibar{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;overflow:hidden}.minibar i{display:block;height:100%;background:var(--season)}
td button.link{cursor:pointer;border:0;background:none;padding:0;text-decoration:underline;font-weight:600}
.hist{display:flex;flex-direction:column;gap:4px;font-size:13px;max-height:180px;overflow:auto}
.hist div{display:flex;justify-content:space-between;gap:10px}
.note{font-size:12px;color:var(--muted)}
.warnbtn{font:inherit;font-size:12px;font-weight:700;color:var(--warn);background:transparent;border:1px solid currentColor;border-radius:999px;padding:0 8px;margin-left:6px;cursor:pointer;line-height:18px}
.warnbox{margin-top:8px;padding:10px 12px;border:1px solid var(--warn);border-radius:10px;font-size:12px;max-width:600px;color:var(--ink)}
.warnbox ul{margin:0 0 6px;padding-left:18px}.warnbox li{margin:2px 0}.warnbox a{color:var(--warn)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.err{padding:18px;border-radius:12px;border:1px solid var(--single)}
@media (max-width:560px){.kpis>.kpi:last-child:nth-child(odd){grid-column:1/-1}h1{font-size:26px}.big{font-size:34px}.kpi .v{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="title"></h1>
      <div class="small muted" id="updated"></div>
      <div class="warnbox" id="warnBox" hidden></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <div class="seg small-seg" role="group" aria-label="Language" id="langSeg"></div>
      <div class="seg small-seg" role="group" id="themeSeg"></div>
    </div>
  </header>

  <div class="controls">
    <div class="seg" role="group" id="tabSeg"></div>
    <div class="seg" role="group" id="whenSeg"></div>
  </div>

  <section class="kpis" id="kpis" aria-live="polite"></section>
  <main id="view"><div class="empty" data-t="loading"></div></main>
  <footer class="note" id="foot"></footer>
</div>

<div class="modal" id="shareModal" hidden role="dialog" aria-modal="true">
  <div class="modal-box">
    <div id="shareBody"></div>
    <button type="button" class="modal-x" id="shareX" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="modal-actions">
      <button type="button" class="btn primary" id="shareCopy"></button>
      <button type="button" class="btn" id="shareGo"></button>
      <a class="btn" id="shareDl" download></a>
    </div>
  </div>
</div>

// label point of a section outline: area-weighted centroid (a notch or an extra corner
// doesn't pull it toward the edge), the corner average if the outline is degenerate
function polyCenter(n){
  let A = 0, x = 0, y = 0;
  for (let i = 0; i < n.length; i++){
    const [x0, y0] = n[i], [x1, y1] = n[(i + 1) % n.length], c = x0 * y1 - x1 * y0;
    A += c; x += (x0 + x1) * c; y += (y0 + y1) * c;
  }
  if (Math.abs(A) < 1e-6) return [n.reduce((a, p) => a + p[0], 0) / n.length, n.reduce((a, p) => a + p[1], 0) / n.length];
  return [x / (3 * A), y / (3 * A)];
}
const vilniusDay = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Vilnius" }).format(d);

}

const DAY = 864e5;
function curveOf(g){                      // [[days before tip-off (<= 0), cumulative singles]]
  const start = new Date(g.start).getTime(), pts = (g.sales || []).map(([h, n]) => [(new Date(h).getTime() - start) / DAY, n]);
  if (!pts.length) return pts;
  const end = Math.min(0, (Date.now() - start) / DAY);
  if (end > pts[pts.length - 1][0]) pts.push([end, pts[pts.length - 1][1]]);   // flat to now / tip-off
  return pts.filter((p) => p[0] <= 0.01);
}
function valueAt(pts, d){ let v = null; for (const [x, y] of pts){ if (x <= d) v = y; else break; } return v; }
function renderAnalysis(){
  const games = DATA.games.filter((g) => (g.sales || []).length).sort((a, b) => a.start.localeCompare(b.start));
  if (!games.length){ $("view").innerHTML = `<div class="empty">${t("noData")}</div>`; return; }
  const upcoming = games.filter((g) => !g.played);
  const sel = games.find((g) => g.id === S.agame) || upcoming[0] || games[games.length - 1];
  S.agame = sel.id;
  const curves = games.map((g) => ({ g, pts: curveOf(g) }));
  const minAll = Math.min(...curves.map((c) => c.pts.length ? c.pts[0][0] : 0));
  const range = S.range === "all" ? Math.min(-1, Math.floor(minAll)) : -Number(S.range);
  const vis = curves.map((c) => ({ g: c.g, pts: c.pts.filter((p) => p[0] >= range) , all: c.pts }));
  // value at the left edge so a line entering the window starts at the right height
  vis.forEach((c) => { const v = valueAt(c.all, range); if (v != null && (!c.pts.length || c.pts[0][0] > range)) c.pts.unshift([range, v]); });
  const ymax = Math.max(10, ...vis.map((c) => Math.max(0, ...c.pts.map((p) => p[1]))));
  // drawn at the real width (text stays at its normal size), shorter on phones
  const W = Math.max(300, ($("view").clientWidth || 900) - 34), H = W < 600 ? 230 : 290, L = 48, R = 18, Tp = 14, B = 34;
  const X = (d) => L + (d - range) / (0 - range) * (W - L - R), Y = (v) => Tp + (1 - v / ymax) * (H - Tp - B);
  const step = (pts) => pts.map(([x, y], i) => (i ? `H${X(x).toFixed(1)}V${Y(y).toFixed(1)}` : `M${X(x).toFixed(1)},${Y(y).toFixed(1)}`)).join("");
  const nice = (m) => { const e = Math.pow(10, Math.floor(Math.log10(m))), f = m / e; return (f <= 2 ? 0.5 : f <= 5 ? 1 : 2) * e; };
  const yt = nice(ymax), yTicks = []; for (let v = 0; v <= ymax; v += yt) yTicks.push(v);
  const maxTicks = W < 600 ? 4 : 8, xs = [1, 2, 5, 7, 14, 30, 60, 90].find((st) => -range / st <= maxTicks) || 180, xTicks = []; for (let d = 0; d >= range; d -= xs) xTicks.push(d);
  const others = vis.filter((c) => c.g.id !== sel.id && c.pts.length > 1);
  const me = vis.find((c) => c.g.id === sel.id);
  const startMs = new Date(sel.start).getTime();
  const evs = (sel.priceEvents || []).map((e) => ({ e, d: (new Date(e.ts).getTime() - startMs) / DAY })).filter((x) => x.d >= range && x.d <= 0);

function expectedVsActual(played){

function attendanceBy(played){
  if (!played.length) return "";
  const wd = (g) => fmt(g.start, { weekday: "long" }), hr = (g) => fmt(g.start, { hour: "2-digit", minute: "2-digit" });
  const group = (key) => { const m = {}; played.forEach((g) => { const k = key(g); (m[k] = m[k] || []).push(g.attendance); });
    return Object.entries(m).map(([k, v]) => [k, v.reduce((a, b) => a + b, 0) / v.length, v.length]).sort((a, b) => b[1] - a[1]); };
  const max = Math.max(...played.map((g) => g.attendance));
  const block = (title, rows) => `<div><div class="small muted" style="margin-bottom:4px">${t("byTitle")} ${title}</div>${rows.map(([k, v, n]) =>
    `<div class="byrow small"><span>${esc(k)} <span class="muted">(${n} ${t("nGames")})</span></span><span class="minibar wide"><i style="width:${(100 * v / max).toFixed(0)}%"></i></span><span class="num">${nf(v)}</span></div>`).join("")}</div>`;
  return `<section class="panel" style="padding:14px 16px"><div class="bygrid">
    ${block(t("byOpp"), group((g) => g.opp))}${block(t("byDay"), group(wd))}${block(t("byTime"), group(hr))}${block(t("byComp"), group((g) => g.comp))}
  </div><p class="note" style="margin:8px 0 0">${t("avgAtt")}</p></section>`;
}

    [t("singlesSold"), nf(singles), (S.when === "played" ? t("played") : t("upcoming")) + " · " + gamesN(gs.length)],
    [t("clubRevenue"), eur(rev), t("clubRevenueSub")],
    [t("avgValue"), singles ? eur(gross / singles, 2) : "–", singles ? t("avgValueSub", { p: eur(rev / singles, 2) }) : ""]
  ];
  $("kpis").innerHTML = k.map(([l, v, s]) => `<div class="panel kpi"><span class="small muted">${esc(l)}</span><span class="v">${esc(v)}</span><span class="small muted">${esc(s)}</span></div>`).join("");
}

function renderGames(){

  gs.sort((a, b) => { const x = key(a), y = key(b); return x < y ? -1 : x > y ? 1 : 0; });

function sectionValue(s){
  const seats = s.seats || 1;
  if (S.mode === "price") return s._p;
  return (s.season + s.singles) / seats;
}

// colours of the arena map for one game (also used by the share picture)
function arenaColors(g){
  const secs = DATA.sections[g.id] || [];
  const byId = {}; secs.forEach((s) => { byId[s.id] = s; });
  const prices = secs.map((s) => s.price || 0).filter((p) => p > 0);
  const lo = Math.log(Math.min(...prices, 1e9)), hi = Math.log(Math.max(...prices, 1));
  secs.forEach((s) => { s._p = s.price && hi > lo ? (Math.log(s.price) - lo) / (hi - lo) : 0; });
  const low = cssVar("--low"), mid = cssVar("--mid"), high = cssVar("--high"), closed = cssVar("--closed");
  const scale = (f) => f < 0.5 ? mix(low, mid, f * 2) : mix(mid, high, (f - 0.5) * 2);
  const labelInk = (fill) => { const rgb = fill.match(/\d+/g).map(Number); return (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255 > 0.55 ? "#1A1208" : "#FFFFFF"; };
  const legend = { taken: ["0%", "100% " + t("takenWord")], price: [t("cheap"), eur(Math.max(...prices, 0))] }[S.mode];
  return { secs, byId, prices, scale, closed, labelInk, legend, shapes: DATA.shapes[g.conf] || [] };
}

// keep the game bar where it was, then slide so the selected game is in the middle
function centerChip(prevLeft){
  const bar = $("chips"); if (!bar) return;
  const chip = bar.querySelector('.chip[aria-pressed="true"]'); if (!chip) return;
  bar.style.scrollBehavior = "auto"; bar.scrollLeft = prevLeft || 0;
  if (prevLeft != null && S._centered === S.game) return;   // same game (e.g. a section was picked): keep the bar where it is
  S._centered = S.game;
  const target = chip.offsetLeft - bar.offsetLeft - (bar.clientWidth - chip.offsetWidth) / 2;
  bar._auto = Date.now();
  requestAnimationFrame(() => { bar.style.scrollBehavior = ""; bar.scrollTo({ left: Math.max(0, target), behavior: prevLeft == null ? "auto" : "smooth" }); });
}

// game bar scroll indicator: visible until first used; afterwards it fades out when idle
// and comes back while scrolling or when the pointer is over the bar. Draggable.
function scrollIndicator(el, bar, thumb, key){
  if (!el || !bar) return;
  S.sbUsed = S.sbUsed || {};
  let timer;
  const geo = () => { const tw = bar.clientWidth, ratio = el.clientWidth / el.scrollWidth, w = Math.max(36, tw * ratio); return { tw, w, max: el.scrollWidth - el.clientWidth }; };
  const update = () => {
    const { tw, w, max } = geo();
    bar.hidden = max <= 1;
    thumb.style.width = w + "px";
    thumb.style.left = (max > 0 ? (el.scrollLeft / max) * (tw - w) : 0) + "px";
  };
  const show = () => { bar.classList.remove("idle"); clearTimeout(timer); if (S.sbUsed[key]) timer = setTimeout(() => { if (!bar.classList.contains("drag")) bar.classList.add("idle"); }, 1200); };
  const used = () => { S.sbUsed[key] = true; show(); };
  if (S.sbUsed[key]) bar.classList.add("idle");
  el.addEventListener("scroll", () => { update(); if (!(el._auto && Date.now() - el._auto < 700)) used(); }, { passive: true });
  [el, bar].forEach((n) => n.addEventListener("pointermove", () => { if (S.sbUsed[key]) show(); }, { passive: true }));
  // drag the thumb, or click the track to jump
  let drag = null;
  bar.addEventListener("pointerdown", (e) => {
    const { tw, w, max } = geo(), r = bar.getBoundingClientRect();
    if (e.target !== thumb) el.scrollLeft = ((e.clientX - r.left - w / 2) / (tw - w)) * max;
    drag = { x: e.clientX, left: el.scrollLeft, k: max / Math.max(1, tw - w) };
    bar.setPointerCapture(e.pointerId); bar.classList.add("drag"); used(); e.preventDefault();
  });
  bar.addEventListener("pointermove", (e) => { if (drag) el.scrollLeft = drag.left + (e.clientX - drag.x) * drag.k; });
  const end = () => { drag = null; bar.classList.remove("drag"); show(); };
  bar.addEventListener("pointerup", end); bar.addEventListener("pointercancel", end);
  if (window._sbResize) window.removeEventListener("resize", window._sbResize);
  window._sbResize = update; window.addEventListener("resize", update);
  if (!window._chartResize){         // the insights chart is drawn at the real width: redraw on resize
    let tm; window._chartResize = true;
    window.addEventListener("resize", () => { clearTimeout(tm); tm = setTimeout(() => { if (S.tab === "analysis") render(); }, 200); });
  }
  update();
}

function statusTag(s){
  if (s.status === "soldout") return ` <span class="tag soldout">${t("soldOut")}</span>`;
  if (s.status === "closed") return ` <span class="tag closed">${t("closedSec")}</span>`;
  return "";
}

// ▲/▼ against the first logged price, for the sections table
function priceChg(s){
  const h = s.history || [];
  if (h.length < 2 || s.price == null || h[0][1] === s.price) return "";
  const up = s.price > h[0][1], last = h[h.length - 1][0];
  return `<span class="pchg ${up ? "up" : "down"}" title="${esc(t("priceFrom", { p: eur(h[0][1]), d: dShort(last) }))}">${up ? "▲" : "▼"}</span>`;
}

// price history card: first -> now summary, then every change (newest first) with its direction
function priceHistoryHtml(s){
  const zs = (s.zones || []).filter((z) => z.history && z.history.length);
  if (zs.length > 1)   // several price zones: one history per zone, open zones first
    return zs.slice().sort((a, b) => (b.open - a.open) || (a.price - b.price))
      .map((z) => `<div style="font-weight:600;margin-top:8px">${esc(z.name)}${z.open ? "" : ` <span class="tag soldout">${t("soldOut")}</span>`}</div>${historyRows(z.history)}`).join("");
  return historyRows(s.history || []);
}

function historyRows(h){
  if (!h.length) return "";
  if (h.length === 1) return `<div class="muted">${t("unchanged", { d: dTime(h[0][0]) })}</div>`;
  const first = h[0][1], now = h[h.length - 1][1], diff = now - first;
  const head = diff ? `<div class="pchg ${diff > 0 ? "up" : "down"}" style="font-size:13px">${diff > 0 ? "▲" : "▼"} ${esc(t("priceSummary", { a: eur(first), b: eur(now), d: (diff > 0 ? "+" : "−") + eur(Math.abs(diff)) }))}</div>`
                    : `<div class="muted">${esc(t("priceBack", { a: eur(first) }))}</div>`;
  const rows = h.map((x, i) => {
    const prev = i ? h[i - 1][1] : null, arrow = prev == null ? "" : x[1] > prev ? "▲" : x[1] < prev ? "▼" : "";
    return `<div><span class="muted">${esc(dTime(x[0]))}</span><span class="num">${arrow ? `<span class="pchg ${x[1] > prev ? "up" : "down"}">${arrow}</span> ` : ""}${eur(x[1])} <span class="muted">(${t("value").toLowerCase()} ${eur(x[1] - x[2])})</span></span></div>`;
  }).reverse().join("");
  return head + rows;
}

function fanPanel(f){
  return `<div class="panel">
    <h2 style="margin:0;font-size:22px">${esc(f.title)} <span class="tag fan">${FAN}</span></h2>
    <div class="small muted">${t("fanNote")}</div>
    <div class="grid2"><div><span class="muted">${t("seats")}</span><b class="num">${nf(f.seats)}</b></div><div><span class="muted">${t("expectedLong")}</span><b class="num">~${nf(f.seats)}</b></div></div>
  </div>
  <div class="panel"><div style="font-weight:600">${t("seatPlan")}</div><div id="seatBox"><div class="note">${t("loading")}</div></div></div>`;
}

// ticket value / fee of a section; a range when its open zones differ
function openZones(s){ return (s.zones || []).filter((z) => z.open); }
function valueRange(s){
  const v = openZones(s).map((z) => z.price - (z.fee || 0));
  if (v.length < 2 || Math.min(...v) === Math.max(...v)) return eur(s.price - (s.fee || 0));
  return eur(Math.min(...v)) + "–" + eur(Math.max(...v));
}

function seatLabel(q){
  const [row, place, , , cat, price, fee, ts] = q;
  let st = cat === "F" ? FAN + " · " + t("catF") : cat === "S" ? t("catS") : cat === "O" ? t("catO", { d: ts ? dTime(ts) : "" }) : cat === "B" ? t("catB") : cat === "X" ? t("catX") : t("catA");

async function makeShareImage(g, kind){

  const draw = kind === "arena" ? drawArenaShare : drawShare;

  const probe = document.createElement("canvas"); probe.width = 1080; probe.height = 2400;
  const contentEnd = draw(probe.getContext("2d"), g, 1080, 2400);
  const cv = document.createElement("canvas"); cv.width = 1080; cv.height = Math.ceil(contentEnd + 130);

  $("shareBody").innerHTML = `<img src="${share.url}" alt="${esc(g.opp + " · " + nf(expectedOf(g)) + " " + t("expected"))}">`;
  $("shareDl").href = share.url; $("shareDl").setAttribute("download", name);
  const canFiles = !!(navigator.canShare && navigator.canShare({ files: [share.file] }));
  $("shareGo").hidden = !(canFiles || navigator.share);
}

function closeShare(fromBack){
  if (!share.open) return;
  share.open = false; $("shareModal").hidden = true;
  if (share.url){ URL.revokeObjectURL(share.url); share.url = null; }
  if (!fromBack && history.state && history.state.share) history.back();
}

// copy the picture to the clipboard (Chrome/Edge, Safari, Firefox 127+); paste with Ctrl/Cmd+V
function canCopyImage(){ return !!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem && window.isSecureContext); }
$("shareCopy").addEventListener("click", async () => {
  const btn = $("shareCopy");
  if (!share.file) return;
  try {
    await navigator.clipboard.write([new ClipboardItem({ "image/png": share.file })]);
    btn.innerHTML = ICON_OK + `<span>${esc(t("copied"))}</span>`;
  } catch (e) {
    btn.innerHTML = `<span>${esc(t("copyFailed"))}</span>`;
  }
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.innerHTML = ICON_COPY + `<span>${esc(t("copy"))}</span>`; }, 2200);
});

$("shareGo").addEventListener("click", async () => {
  if (!share.file) return;
  const g = share.game, text = `${g.opp} · ${dFull(g.start)} · ${nf(expectedOf(g))} ${t("expected")}`;
  try {
    if (navigator.canShare && navigator.canShare({ files: [share.file] })) await navigator.share({ files: [share.file], title: t("title"), text: text });
    else if (navigator.share) await navigator.share({ title: t("title"), text: text, url: location.href });
  } catch (e) { /* closed the share sheet */ }
});
$("shareX").addEventListener("click", () => closeShare());
$("shareModal").addEventListener("click", (e) => { if (e.target === $("shareModal")) closeShare(); });   // tap outside
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && share.open) closeShare(); });
window.addEventListener("popstate", () => { if (share.open) closeShare(true); });

// ---------------------------------------------------------------- start
setTheme();
render();
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (S.theme === "auto") render(); });
fetch("data.json", { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => {
  DATA = d;
  if (!DATA.games.some((g) => !g.played)) S.when = "played";
  if (S.game){ const g = DATA.games.find((x) => x.id === S.game); if (g) S.when = g.played ? "played" : "upcoming"; }
  render();
}).catch(() => { $("view").innerHTML = `<div class="err">${esc(t("loadErr"))}</div>`; });
</script>
</body>
