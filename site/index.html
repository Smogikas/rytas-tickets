<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryto bilietai</title>
<meta name="description" content="Vilniaus „Ryto“ namų rungtynių bilietų pardavimai, abonementai ir arenos planas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Crect x='7' y='9' width='18' height='14' rx='2' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* light: cream and brown; sand for free seats */
:root{
  --bg:#F6EFE2; --panel:#FFFAF0; --ink:#2A1C11; --muted:#6B5644; --line:#E2D3BA;
  --accent:#7B4A23; --accent-ink:#FFF8EC; --season:#6F6052; --single:#C47A2C; --free:#F6EFE2; --seat-line:#B8A386;
  --closed:#EFE5D2; --low:#F0E2C8; --mid:#CF9F67; --high:#7B4A23; --court:#D8C7A8; --focus:#7B4A23; --bcl:#2E5C8A; --sel:#C47A2C; --avail:#E2C79C;
  color-scheme: light;
}
/* dark: charcoal with amber; teal for the data (as in light) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1C1E; --panel:#232528; --ink:#ECE9E3; --muted:#A6A39C; --line:#36393D;
    --accent:#E0A458; --accent-ink:#1B1C1E; --season:#3F8F88; --single:#E0A458; --free:#2A2D30; --seat-line:#5A5E63;
    --closed:#232528; --low:#2C3432; --mid:#245F59; --high:#2A9D8F; --court:#45494E; --focus:#F0C27F; --bcl:#9DB8D9; --sel:#F4EEDC; --avail:#D9DDD4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1C1E; --panel:#232528; --ink:#ECE9E3; --muted:#A6A39C; --line:#36393D;
  --accent:#E0A458; --accent-ink:#1B1C1E; --season:#3F8F88; --single:#E0A458; --free:#2A2D30; --seat-line:#5A5E63;
  --closed:#232528; --low:#2C3432; --mid:#245F59; --high:#2A9D8F; --court:#45494E; --focus:#F0C27F; --bcl:#9DB8D9; --sel:#F4EEDC; --avail:#D9DDD4;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:"Space Grotesk",Inter,sans-serif}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible,polygon:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:20px}
.muted{color:var(--muted)}
.small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-size:32px;letter-spacing:-.01em}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--panel);border:1px solid var(--line);flex-wrap:wrap}
.seg button,.chip{cursor:pointer;border:1px solid transparent;background:transparent;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.small-seg button{padding:5px 9px;font-size:12px}
.chip{border-color:var(--line);text-align:left}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .v{font-family:"Space Grotesk",Inter,sans-serif;font-size:24px;font-weight:700;overflow-wrap:anywhere}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid transparent}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;border-radius:18px;overflow:hidden}
.card:hover{border-color:var(--accent)}
.card-open{cursor:pointer;text-align:left;padding:20px 20px 10px;display:flex;flex-direction:column;gap:14px;background:none;border:0;width:100%;color:inherit;font:inherit}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px 14px 20px;margin-top:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;min-height:40px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn svg{width:17px;height:17px;flex:none}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal-box{position:relative;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:20px;overflow:hidden;
  --ar:0.86; width:min(400px, 100%, calc((100vh - 110px) * var(--ar)));display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-box img{width:100%;height:auto;display:block}
.modal-x{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.modal-x:hover{border-color:var(--accent)}
.modal-x svg{width:16px;height:16px}
.modal-actions{display:flex;gap:8px;padding:0 16px 16px}
.modal-actions .btn{flex:1 1 0}
.seatwrap{overflow:auto;max-height:440px}
.seatwrap svg{display:block;margin:0 auto}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:5px;border:1px solid currentColor}
.badge.LKL{color:var(--accent)} .badge.BCL{color:var(--bcl)}
.opp{font-family:"Space Grotesk",Inter,sans-serif;font-size:22px;font-weight:700;line-height:1.15}
.big{font-family:"Space Grotesk",Inter,sans-serif;font-size:40px;font-weight:700;line-height:1}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--free);border:1px solid var(--line)}
.bar i{display:block;height:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;font-size:13px}
.grid2 b{display:block;font-family:"Space Grotesk",Inter,sans-serif;font-size:17px}
.arena{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.mapbox{flex:3 1 520px;min-width:0;padding:16px;display:flex;flex-direction:column;gap:12px}
.side{flex:2 1 340px;min-width:0;display:flex;flex-direction:column;gap:14px}
.side .panel{padding:18px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* own scroll indicator for the game bar: themed, no arrows, fades out when idle after first use */
.sbar{position:relative;height:6px;margin-top:6px;border-radius:3px;transition:opacity .45s ease;touch-action:none}
.sbar.idle{opacity:0}
.sbar[hidden]{display:none}
.sbar i{position:absolute;top:0;height:6px;border-radius:3px;background:var(--seat-line);cursor:grab}
.sbar:hover i,.sbar.drag i{background:var(--muted)}
.sbar.drag i{cursor:grabbing}
/* thin scrollbars in theme colours, no arrows */
.sb::-webkit-scrollbar{width:7px;height:7px}
.sb::-webkit-scrollbar-button{display:none;width:0;height:0}
.sb::-webkit-scrollbar-track{background:transparent}
.sb::-webkit-scrollbar-thumb{background:var(--seat-line);border-radius:4px}
.sb::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.sb::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){
  .sb{scrollbar-width:thin;scrollbar-color:var(--seat-line) transparent}
}
.chip small{display:block;font-size:11px;font-weight:500;opacity:.8}
svg.map{width:100%;max-width:720px;margin:0 auto;display:block;height:auto}
svg.map polygon{cursor:pointer;stroke:var(--line);stroke-width:2;vector-effect:non-scaling-stroke}
svg.map polygon.closed{cursor:default;fill:transparent;stroke-dasharray:6 5;stroke:var(--seat-line);stroke-width:1.5}
svg.map polygon.withdrawn{fill:transparent;stroke-dasharray:6 5;stroke:var(--muted);stroke-width:2}
svg.map polygon.stripes{pointer-events:none;stroke:none}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;vertical-align:middle;margin-left:6px;white-space:nowrap}
.tag.soldout{background:var(--accent);color:var(--accent-ink)}
.tag.closed{border:1px dashed var(--muted);color:var(--muted)}
.pchg{font-size:12px;font-weight:600;white-space:nowrap}
.pchg.up{color:var(--single)} .pchg.down{color:var(--season)}
.sw.striped{background:repeating-linear-gradient(45deg,var(--high) 0 3px,rgba(255,255,255,.55) 3px 5px)}
svg.map polygon.sel{stroke:var(--sel);stroke-width:3.5}
svg.map text{font:700 15px "Space Grotesk",Inter,sans-serif;pointer-events:none;text-anchor:middle;dominant-baseline:central}
svg.seats rect{cursor:pointer}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}
tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
td button.link{cursor:pointer;border:0;background:none;padding:0;text-decoration:underline;font-weight:600}
.hist{display:flex;flex-direction:column;gap:4px;font-size:13px;max-height:180px;overflow:auto}
.hist div{display:flex;justify-content:space-between;gap:10px}
.note{font-size:12px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.err{padding:18px;border-radius:12px;border:1px solid var(--single)}
@media (max-width:560px){h1{font-size:26px}.big{font-size:34px}.kpi .v{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="title"></h1>
      <div class="small muted" id="updated"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <div class="seg small-seg" role="group" aria-label="Language" id="langSeg"></div>
      <div class="seg small-seg" role="group" id="themeSeg"></div>
    </div>
  </header>

  <div class="controls">
    <div class="seg" role="group" id="tabSeg"></div>
    <div class="seg" role="group" id="whenSeg"></div>
  </div>

  <section class="kpis" id="kpis" aria-live="polite"></section>
  <main id="view"><div class="empty" data-t="loading"></div></main>
  <footer class="note" id="foot"></footer>
</div>

<div class="modal" id="shareModal" hidden role="dialog" aria-modal="true">
  <div class="modal-box">
    <div id="shareBody"></div>
    <button type="button" class="modal-x" id="shareX" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="modal-actions">
      <button type="button" class="btn primary" id="shareGo"></button>
      <a class="btn" id="shareDl" download></a>
    </div>
  </div>
</div>

<script>
"use strict";
const T = {
  lt: {
    title: "Ryto bilietai", eyebrow: "Vilniaus „Rytas“ · namų rungtynės · Arena Vilnius", loading: "Kraunama…",
    updated: "Duomenys atnaujinti {d} · atnaujinama kas valandą", games: "Rungtynės", arena: "Arenos planas",
    upcoming: "Būsimos", played: "Sužaistos", all: "Visos", sort: "Rikiuoti", byDate: "Data", byExpected: "Žiūrovai",
    bySingles: "Pavieniai", byRevenue: "Pajamos", byAvg: "Vid. vertė", theme: "Tema", auto: "Auto", light: "Šviesi", dark: "Tamsi",
    nextGame: "Kitos rungtynės", seasonSeats: "Abonementų vietos", seasonSub: "niekada nebuvo laisvos ({n} rungt.)",
    singlesSold: "Parduota pavienių bilietų", gamesN: "{n} rungtynės", clubRevenue: "Klubo pajamos",
    clubRevenueSub: "bilieto vertė be mokesčių", avgValue: "Vid. bilieto vertė", avgValueSub: "pirkėjai mokėjo vid. {p}",
    vs: "Rytas –", expected: "laukiama žiūrovų", expectedLong: "Laukiama žiūrovų", singles: "Pavieniai bilietai",
    available: "Laisvi bilietai", revenue: "Klubo pajamos", avg: "Vid. vertė", seen: "Stebint parduota: {n}",
    attendance: "Lankomumas", attVs: "laukta {e}", noAtt: "lankomumas dar neįrašytas",
    inDays: "po {n} d.", tomorrow: "rytoj", today: "šiandien", playedLbl: "sužaista",
    legendSeason: "Abonementai", legendSingle: "Parduoti pavieniai", legendFree: "Laisvi",
    noGames: "Šiame sąraše rungtynių nėra.", noData: "vietų duomenys dar renkami",
    modeTaken: "% užimta", modePrice: "Kaina", low: "mažai", high: "daug",
    cheap: "pigiausia", notOnSale: "Šioms rungtynėms neparduodama",
    pickSection: "Spustelėkite sektorių žemėlapyje arba lentelėje.",
    seats: "Vietos", season: "Abonementai", single: "Pavieniai", free: "Laisvos", full: "Užimta",
    price: "Kaina", value: "Vertė", fee: "Mokesčiai", section: "Sektorius",
    seatPlan: "Vietų planas", seatHint: "Užveskite arba palieskite vietą", row: "Eilė", place: "vieta",
    catS: "abonementas", catO: "parduota {d}", catB: "parduota iki stebėjimo pradžios (kaina įvertinta)", catA: "laisva",
    paid: "pirkėjas moka {p}, klubui {v}",
    noLayout: "Šio sektoriaus vietų išdėstymas bus rodomas po kito vietų plano nuskaitymo.",
    priceHistory: "Kainų istorija", unchanged: "Kaina nesikeitė nuo {d}", openedLater: "Atidarytas pardavimui {d}",
    sectionsTable: "Sektoriai", totalRow: "Iš viso",
    foot: "Laukiama žiūrovų = abonementų vietos + parduoti pavieniai bilietai (jei ateitų visi abonementų turėtojai). Klubo pajamos = bilieto vertė be bilietai.lt, arenos, administravimo ir ložės mokesčių. Iki stebėjimo pradžios (2026-11-05) parduotų bilietų kaina įvertinta pagal pirmą užfiksuotą kainą. Abonementai – vietos, kurios nebuvo laisvos nė vienose stebėtose rungtynėse. Rodomi tik internetu parduodami sektoriai.",
    loadErr: "Nepavyko įkelti duomenų.",
    share: "Dalintis", shareTitle: "Dalintis rungtynėmis", download: "Atsisiųsti", close: "Uždaryti", making: "Ruošiamas paveikslėlis…",
    shareFoot: "Duomenys {d}",
    soldOut: "Išparduota", closedSec: "Uždarytas", closedOn: "uždarytas {d}", priceFrom: "anksčiau {p} (pakeista {d})"
  },
  en: {
    title: "Rytas tickets", eyebrow: "Vilniaus „Rytas“ · home games · Arena Vilnius", loading: "Loading…",
    updated: "Data updated {d} · refreshed hourly", games: "Games", arena: "Arena plan",
    upcoming: "Upcoming", played: "Played", all: "All", sort: "Sort", byDate: "Date", byExpected: "Crowd",
    bySingles: "Singles", byRevenue: "Revenue", byAvg: "Avg value", theme: "Theme", auto: "Auto", light: "Light", dark: "Dark",
    nextGame: "Next game", seasonSeats: "Season-ticket seats", seasonSub: "never available ({n} games)",
    singlesSold: "Single tickets sold", gamesN: "{n} games", clubRevenue: "Club revenue",
    clubRevenueSub: "ticket value excl. fees", avgValue: "Avg ticket value", avgValueSub: "buyers paid avg {p}",
    vs: "Rytas vs", expected: "expected crowd", expectedLong: "Expected crowd", singles: "Single tickets",
    available: "Available", revenue: "Club revenue", avg: "Avg value", seen: "Sold while tracked: {n}",
    attendance: "Attendance", attVs: "expected {e}", noAtt: "attendance not recorded yet",
    inDays: "in {n} days", tomorrow: "tomorrow", today: "today", playedLbl: "played",
    legendSeason: "Season tickets", legendSingle: "Single tickets sold", legendFree: "Available",
    noGames: "No games in this list.", noData: "seat data still being collected",
    modeTaken: "% taken", modePrice: "Price", low: "low", high: "high",
    cheap: "cheapest", notOnSale: "Not on sale for this game",
    pickSection: "Click a section on the map or in the table.",
    seats: "Seats", season: "Season", single: "Single", free: "Available", full: "Taken",
    price: "Price", value: "Value", fee: "Fees", section: "Section",
    seatPlan: "Seat plan", seatHint: "Hover or tap a seat", row: "Row", place: "seat",
    catS: "season ticket", catO: "sold {d}", catB: "sold before tracking began (price estimated)", catA: "available",
    paid: "buyer pays {p}, club gets {v}",
    noLayout: "Seat positions for this section appear after the next seat-plan scan.",
    priceHistory: "Price history", unchanged: "Price unchanged since {d}", openedLater: "Opened for sale {d}",
    sectionsTable: "Sections", totalRow: "Total",
    foot: "Expected crowd = season-ticket seats + single tickets sold (attendance if every season holder comes). Club revenue = ticket value excl. bilietai.lt, arena, administration and lounge fees. Tickets sold before tracking began (5 Nov 2026) are priced at the first logged price. Season tickets = seats never available in any tracked game. Only sections sold online are shown.",
    loadErr: "Could not load the data.",
    share: "Share", shareTitle: "Share this game", download: "Download", close: "Close", making: "Making the picture…",
    shareFoot: "Data {d}",
    soldOut: "Sold out", closedSec: "Closed", closedOn: "closed {d}", priceFrom: "was {p} (changed {d})"
  }
};

const store = {
  get(k, d){ try { const v = localStorage.getItem("rytas." + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem("rytas." + k, v); } catch (e) {} }
};
const S = {
  lang: store.get("lang", "lt"), theme: store.get("theme", "auto"), tab: store.get("tab", "games"),
  when: "upcoming", comp: "all", sort: "date", game: store.get("game", null), sec: null, mode: "taken", seat: null
};
let DATA = null;
const seatCache = {};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const t = (k, vars) => { let s = (T[S.lang] || T.lt)[k] || k; for (const v in vars || {}) s = s.replace("{" + v + "}", vars[v]); return s; };
const loc = () => S.lang === "en" ? "en-GB" : "lt-LT";
const nf = (n) => n == null ? "–" : new Intl.NumberFormat(loc(), { maximumFractionDigits: 0 }).format(n);
const eur = (n, d) => n == null ? "–" : new Intl.NumberFormat(loc(), { style: "currency", currency: "EUR", maximumFractionDigits: d == null ? 0 : d, minimumFractionDigits: d == null ? 0 : d }).format(n);
const fmt = (iso, o) => new Intl.DateTimeFormat(loc(), Object.assign({ timeZone: "Europe/Vilnius" }, o)).format(new Date(iso));
const dShort = (iso) => fmt(iso, { day: "numeric", month: "short" });
const dFull = (iso) => fmt(iso, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const dTime = (iso) => fmt(iso, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const pct = (a, b) => b ? (100 * a / b) : 0;
const vilniusDay = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Vilnius" }).format(d);
function daysTo(iso){
  const a = Date.parse(vilniusDay(new Date()) + "T00:00:00Z"), b = Date.parse(vilniusDay(new Date(iso)) + "T00:00:00Z");
  return Math.round((b - a) / 86400000);
}
function whenText(g){
  if (g.played) return t("playedLbl");
  const n = daysTo(g.start);
  return n <= 0 ? t("today") : n === 1 ? t("tomorrow") : t("inDays", { n: n });
}
function setTheme(){ if (S.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", S.theme); }
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function mix(a, b, f){
  const p = (h) => { const x = h.replace("#", ""); return [0, 2, 4].map((i) => parseInt(x.slice(i, i + 2), 16)); };
  const x = p(a), y = p(b); f = Math.max(0, Math.min(1, f));
  return "rgb(" + x.map((v, i) => Math.round(v + (y[i] - v) * f)).join(",") + ")";
}
function segButtons(el, items, current, onPick, label){
  el.setAttribute("aria-label", label || "");
  el.innerHTML = items.map(([v, l]) => `<button type="button" data-v="${esc(v)}" aria-pressed="${v === current}">${esc(l)}</button>`).join("");
  el.onclick = (e) => { const b = e.target.closest("button[data-v]"); if (b) onPick(b.dataset.v); };
}
const shortTitle = (s) => s.indexOf("Parteris") === 0 ? "P2" : s.indexOf("VIP") === 0 ? "VIP" : s.split(" ")[0];

// ---------------------------------------------------------------- render
function render(){
  document.documentElement.lang = S.lang;
  document.title = t("title");
  document.querySelectorAll("[data-t]").forEach((n) => { n.textContent = t(n.dataset.t); });
  segButtons($("langSeg"), [["lt", "LT"], ["en", "EN"]], S.lang, (v) => { S.lang = v; store.set("lang", v); render(); }, "Language / Kalba");
  segButtons($("themeSeg"), [["auto", t("auto")], ["light", t("light")], ["dark", t("dark")]], S.theme, (v) => { S.theme = v; store.set("theme", v); setTheme(); render(); }, t("theme"));
  segButtons($("tabSeg"), [["games", t("games")], ["arena", t("arena")]], S.tab, (v) => { S.tab = v; store.set("tab", v); render(); }, t("games") + " / " + t("arena"));
  segButtons($("whenSeg"), [["upcoming", t("upcoming")], ["played", t("played")]], S.when, (v) => { S.when = v; S.game = null; render(); }, t("upcoming") + " / " + t("played"));
  $("foot").textContent = t("foot");
  if (!DATA) return;
  $("updated").textContent = t("updated", { d: dTime(DATA.updated) });
  renderKpis();
  if (S.tab === "games") renderGames(); else renderArena();
}

function listGames(){
  return DATA.games.filter((g) => (S.when === "played") === g.played);
}

function renderKpis(){
  const gs = listGames();
  const next = DATA.games.filter((g) => !g.played).sort((a, b) => a.start < b.start ? -1 : 1)[0];
  const singles = gs.reduce((s, g) => s + g.singles, 0), rev = gs.reduce((s, g) => s + (g.revenue || 0), 0), gross = gs.reduce((s, g) => s + (g.gross || 0), 0);
  const k = [
    [t("nextGame"), next ? next.opp : "–", next ? dFull(next.start) + " · " + whenText(next) + " · " + nf(next.taken) + " " + t("expected") : ""],
    [t("seasonSeats"), nf(DATA.seasonSeats), t("seasonSub", { n: DATA.games.length })],
    [t("singlesSold"), nf(singles), (S.when === "played" ? t("played") : t("upcoming")) + " · " + t("gamesN", { n: gs.length })],
    [t("clubRevenue"), eur(rev), t("clubRevenueSub")],
    [t("avgValue"), singles ? eur(rev / singles, 2) : "–", singles ? t("avgValueSub", { p: eur(gross / singles, 2) }) : ""]
  ];
  $("kpis").innerHTML = k.map(([l, v, s]) => `<div class="panel kpi"><span class="small muted">${esc(l)}</span><span class="v">${esc(v)}</span><span class="small muted">${esc(s)}</span></div>`).join("");
}

function renderGames(){
  let gs = listGames().filter((g) => S.comp === "all" || g.comp === S.comp);
  const key = { date: (g) => g.start, singles: (g) => -g.singles, revenue: (g) => -(g.revenue || 0), avg: (g) => -(g.avg || 0) }[S.sort];
  gs.sort((a, b) => { const x = key(a), y = key(b); return x < y ? -1 : x > y ? 1 : 0; });
  if (S.when === "played" && S.sort === "date") gs.reverse();
  const comps = ["all"].concat([...new Set(DATA.games.map((g) => g.comp))].sort());
  const cards = gs.map((g) => {
    const has = g.seats > 0;
    const att = g.played ? (g.attendance != null
      ? `<div class="small"><b class="num">${t("attendance")}: ${nf(g.attendance)}</b> <span class="muted">· ${t("attVs", { e: nf(g.taken) })} (${(g.attendance - g.taken >= 0 ? "+" : "") + nf(g.attendance - g.taken)})</span></div>`
      : `<div class="small muted">${t("noAtt")}</div>`) : "";
    return `<article class="panel card"><button type="button" class="card-open" data-game="${esc(g.id)}" aria-label="${esc(t("arena") + ": " + g.opp)}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="badge ${esc(g.comp)}">${esc(g.comp)}</span><span class="small muted">${esc(dFull(g.start))}</span></div>
      <div><div class="small muted">${t("vs")}</div><div class="opp">${esc(g.opp)}</div><div class="small muted">${esc(whenText(g))}</div></div>
      ${has ? `<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="big num">${nf(g.taken)}</span><span class="small muted">${t("expected")}</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${pct(g.season, g.seats)}%;background:var(--season)"></i><i style="width:${pct(g.singles, g.seats)}%;background:var(--single)"></i></div>
      <div class="grid2"><div><span class="muted">${t("singles")}</span><b class="num">${nf(g.singles)}</b></div><div><span class="muted">${t("available")}</span><b class="num">${nf(g.available)}</b></div>
      <div><span class="muted">${t("revenue")}</span><b class="num">${eur(g.revenue)}</b></div><div><span class="muted">${t("avg")}</span><b class="num">${g.singles ? eur(g.avg, 2) : "–"}</b></div></div>
      ` : `<div class="small muted">${t("noData")}</div>`}
      ${att}
    </button>
    <div class="card-foot"><span class="small muted">${has ? t("seen", { n: nf(g.seen) }) : ""}</span>
      <button type="button" class="btn" data-share="${esc(g.id)}" aria-label="${esc(t("share") + ": " + g.opp)}">${ICON_SHARE}<span>${t("share")}</span></button></div>
    </article>`;
  }).join("");
  $("view").innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
    <div class="controls">
      <div class="seg small-seg" role="group" id="compSeg"></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="small muted">${t("sort")}</span><div class="seg small-seg" role="group" id="sortSeg"></div></div>
    </div>
    <div class="legend"><span><i class="sw" style="background:var(--season)"></i>${t("legendSeason")}</span><span><i class="sw" style="background:var(--single)"></i>${t("legendSingle")}</span><span><i class="sw" style="background:var(--free);border-color:var(--line)"></i>${t("legendFree")}</span></div>
    ${gs.length ? `<div class="cards">${cards}</div>` : `<div class="panel empty">${t("noGames")}</div>`}
  </div>`;
  segButtons($("compSeg"), comps.map((c) => [c, c === "all" ? t("all") : c]), S.comp, (v) => { S.comp = v; renderGames(); });
  segButtons($("sortSeg"), [["date", t("byDate")], ["singles", t("bySingles")], ["revenue", t("byRevenue")], ["avg", t("byAvg")]], S.sort, (v) => { S.sort = v; renderGames(); }, t("sort"));
  $("view").querySelectorAll("[data-share]").forEach((b) => b.addEventListener("click", () => openShare(b.dataset.share)));
  $("view").querySelectorAll("[data-game]").forEach((b) => b.addEventListener("click", () => { S.tab = "arena"; S.game = b.dataset.game; S.sec = null; S.seat = null; store.set("tab", "arena"); store.set("game", S.game); render(); window.scrollTo({ top: 0 }); }));
}

function sectionValue(s){
  const seats = s.seats || 1;
  if (S.mode === "price") return s._p;
  return (s.season + s.singles) / seats;
}

// colours of the arena map for one game (also used by the share picture)
function arenaColors(g){
  const secs = DATA.sections[g.id] || [];
  const byId = {}; secs.forEach((s) => { byId[s.id] = s; });
  const prices = secs.map((s) => s.price || 0).filter((p) => p > 0);
  const lo = Math.log(Math.min(...prices, 1e9)), hi = Math.log(Math.max(...prices, 1));
  secs.forEach((s) => { s._p = s.price && hi > lo ? (Math.log(s.price) - lo) / (hi - lo) : 0; });
  const low = cssVar("--low"), mid = cssVar("--mid"), high = cssVar("--high"), closed = cssVar("--closed");
  const scale = (f) => f < 0.5 ? mix(low, mid, f * 2) : mix(mid, high, (f - 0.5) * 2);
  const labelInk = (fill) => { const rgb = fill.match(/\d+/g).map(Number); return (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255 > 0.55 ? "#1A1208" : "#FFFFFF"; };
  const legend = { taken: [t("low"), "100%"], price: [t("cheap"), eur(Math.max(...prices, 0))] }[S.mode];
  return { secs, byId, prices, scale, closed, labelInk, legend, shapes: DATA.shapes[g.conf] || [] };
}

function renderArena(){
  const gs = listGames().slice().sort((a, b) => S.when === "played" ? (a.start < b.start ? 1 : -1) : (a.start < b.start ? -1 : 1));
  if (!gs.length){ $("view").innerHTML = `<div class="panel empty">${t("noGames")}</div>`; return; }
  let g = gs.find((x) => x.id === S.game) || gs[0];
  S.game = g.id;
  const { secs, byId, prices, scale, closed, labelInk, shapes } = arenaColors(g);
  if (!S.sec || !byId[S.sec]) S.sec = (secs.find((s) => s.title === "108") || secs[0] || {}).id || null;
  const polys = shapes.map(([id, pts]) => {
    const s = byId[id];
    const fill = s ? scale(sectionValue(s)) : closed;
    const lbl = s ? s.title + (s.status === "soldout" ? " · " + t("soldOut") : s.status === "closed" ? " · " + t("closedSec") : "") : "";
    const cls = !s ? "closed" : s.status === "closed" ? "withdrawn" : "";
    const poly = `<polygon points="${esc(pts)}" fill="${fill}" class="${cls} ${id === S.sec ? "sel" : ""}" ${s ? `data-sec="${esc(id)}" tabindex="0" role="button" aria-label="${esc(t("section") + " " + lbl)}"` : 'aria-hidden="true"'}></polygon>`;
    return poly + (s && s.status === "soldout" ? `<polygon points="${esc(pts)}" class="stripes" fill="url(#soldStripes)" aria-hidden="true"></polygon>` : "");
  }).join("");
  const labels = shapes.filter(([id]) => byId[id]).map(([id, pts]) => {
    const n = pts.split(" ").map((p) => p.split(",").map(Number));
    const cx = n.reduce((a, p) => a + p[0], 0) / n.length, cy = n.reduce((a, p) => a + p[1], 0) / n.length;
    // label colour by the fill's brightness (withdrawn sections have no fill)
    const ink = byId[id].status === "closed" ? "var(--muted)" : labelInk(scale(sectionValue(byId[id])));
    return `<text x="${cx.toFixed(0)}" y="${cy.toFixed(0)}" fill="${ink}">${esc(shortTitle(byId[id].title))}</text>`;
  }).join("");
  const legend = arenaColors(g).legend;
  const s = byId[S.sec];

  $("view").innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
    <div><div class="chips" id="chips" role="group" aria-label="${esc(t("games"))}">${gs.map((x) => `<button type="button" class="chip" data-game="${esc(x.id)}" aria-pressed="${x.id === g.id}"><small>${esc(dShort(x.start))} · ${esc(x.comp)}</small>${esc(x.opp)}</button>`).join("")}</div>
      <div class="sbar" id="chipsBar" aria-hidden="true"><i id="chipsThumb"></i></div></div>
    <div class="arena">
      <div class="panel mapbox">
        <div class="controls">
          <div><div class="disp" style="font-size:20px;font-weight:700">${esc(g.opp)}</div>
          <div class="small muted">${esc(dFull(g.start))} · ${nf(g.taken)} ${t("expected")} · ${nf(g.available)} ${t("available").toLowerCase()}${g.played && g.attendance != null ? " · " + t("attendance") + " " + nf(g.attendance) : ""}</div></div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div class="seg small-seg" role="group" id="modeSeg"></div>
            <button type="button" class="btn" id="arenaShare" aria-label="${esc(t("share") + ": " + t("arena") + " " + g.opp)}">${ICON_SHARE}<span>${t("share")}</span></button></div>
        </div>
        ${shapes.length ? `<svg class="map" viewBox="0 0 1000 1000" role="group" aria-label="${esc(t("arena"))}">
          <rect x="390" y="170" width="225" height="430" rx="10" fill="none" stroke="var(--court)" stroke-width="3"></rect>
          <line x1="390" y1="385" x2="615" y2="385" stroke="var(--court)" stroke-width="2"></line>
          <circle cx="502" cy="385" r="38" fill="none" stroke="var(--court)" stroke-width="2"></circle>
          <defs><pattern id="soldStripes" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)"><rect width="5" height="12" fill="rgba(255,255,255,.45)"></rect></pattern></defs>
          ${polys}${labels}</svg>` : `<div class="empty">${t("noData")}</div>`}
        <div class="legend"><span>${esc(legend[0])}</span><span style="width:150px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--low),var(--mid),var(--high))"></span><span>${esc(legend[1])}</span>
          <span><i class="sw striped"></i>${t("soldOut")}</span>
          <span><i class="sw" style="border:2px dashed var(--muted)"></i>${t("closedSec")}</span>

      </div>
      <div class="side">
        ${s ? sectionPanel(s, g) : `<div class="panel note">${t("pickSection")}</div>`}

    </div>
    <div class="panel tablebox sb" id="secTable"><table>
      <caption class="small muted" style="text-align:left;padding:10px 12px">${t("sectionsTable")}</caption>
      <thead><tr><th scope="col">${t("section")}</th><th scope="col">${t("price")}</th><th scope="col">${t("value")}</th><th scope="col">${t("seats")}</th><th scope="col">${t("season")}</th><th scope="col">${t("single")}</th><th scope="col">${t("free")}</th><th scope="col">${t("full")}</th><th scope="col">${t("revenue")}</th></tr></thead>
      <tbody>${sorted.map((x) => `<tr class="${x.id === S.sec ? "sel" : ""}"><td><button type="button" class="link" data-sec="${esc(x.id)}">${esc(x.title)}</button>${statusTag(x)}</td>
        <td class="num">${priceChg(x, true)} ${eur(x.price)}</td><td class="num">${eur(x.price != null ? x.price - (x.fee || 0) : null)}</td><td class="num">${nf(x.seats)}</td><td class="num">${nf(x.season)}</td><td class="num">${nf(x.singles)}</td><td class="num">${nf(x.available)}</td><td class="num">${pct(x.seats - x.available, x.seats).toFixed(0)}%</td><td class="num">${eur(x.revenue)}</td></tr>`).join("")}
        <tr><td><b>${t("totalRow")}</b></td><td></td><td></td><td class="num"><b>${nf(tot.seats)}</b></td><td class="num"><b>${nf(tot.season)}</b></td><td class="num"><b>${nf(tot.singles)}</b></td><td class="num"><b>${nf(tot.available)}</b></td><td class="num"><b>${pct(tot.seats - tot.available, tot.seats).toFixed(0)}%</b></td><td class="num"><b>${eur(tot.revenue)}</b></td></tr>

  $("arenaShare").addEventListener("click", () => openShare(g.id, "arena"));
  scrollIndicator($("chips"), $("chipsBar"), $("chipsThumb"), "chips");
  centerChip(prevChips);
  const v = $("view");
  v.querySelectorAll(".chip[data-game]").forEach((b) => b.addEventListener("click", () => { S.game = b.dataset.game; S.seat = null; store.set("game", S.game); renderArena(); }));
  v.querySelectorAll("[data-sec]").forEach((el) => {
    const pick = () => { S.sec = el.dataset.sec; S.seat = null; renderArena(); };
    el.addEventListener("click", pick);
    el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  });
  if (s) loadSeats(g.id).then(() => drawSeats(g, s));
}

// keep the game bar where it was, then slide so the selected game is in the middle
function centerChip(prevLeft){
  const bar = $("chips"); if (!bar) return;
  const chip = bar.querySelector('.chip[aria-pressed="true"]'); if (!chip) return;
  bar.style.scrollBehavior = "auto"; bar.scrollLeft = prevLeft || 0;
  if (prevLeft != null && S._centered === S.game) return;   // same game (e.g. a section was picked): keep the bar where it is
  S._centered = S.game;
  const target = chip.offsetLeft - bar.offsetLeft - (bar.clientWidth - chip.offsetWidth) / 2;
  bar._auto = Date.now();
  requestAnimationFrame(() => { bar.style.scrollBehavior = ""; bar.scrollTo({ left: Math.max(0, target), behavior: prevLeft == null ? "auto" : "smooth" }); });
}

// game bar scroll indicator: visible until first used; afterwards it fades out when idle
// and comes back while scrolling or when the pointer is over the bar. Draggable.
function scrollIndicator(el, bar, thumb, key){
  if (!el || !bar) return;
  S.sbUsed = S.sbUsed || {};
  let timer;
  const geo = () => { const tw = bar.clientWidth, ratio = el.clientWidth / el.scrollWidth, w = Math.max(36, tw * ratio); return { tw, w, max: el.scrollWidth - el.clientWidth }; };
  const update = () => {
    const { tw, w, max } = geo();
    bar.hidden = max <= 1;
    thumb.style.width = w + "px";
    thumb.style.left = (max > 0 ? (el.scrollLeft / max) * (tw - w) : 0) + "px";
  };
  const show = () => { bar.classList.remove("idle"); clearTimeout(timer); if (S.sbUsed[key]) timer = setTimeout(() => { if (!bar.classList.contains("drag")) bar.classList.add("idle"); }, 1200); };
  const used = () => { S.sbUsed[key] = true; show(); };
  if (S.sbUsed[key]) bar.classList.add("idle");
  el.addEventListener("scroll", () => { update(); if (!(el._auto && Date.now() - el._auto < 700)) used(); }, { passive: true });
  [el, bar].forEach((n) => n.addEventListener("pointermove", () => { if (S.sbUsed[key]) show(); }, { passive: true }));
  // drag the thumb, or click the track to jump
  let drag = null;
  bar.addEventListener("pointerdown", (e) => {
    const { tw, w, max } = geo(), r = bar.getBoundingClientRect();
    if (e.target !== thumb) el.scrollLeft = ((e.clientX - r.left - w / 2) / (tw - w)) * max;
    drag = { x: e.clientX, left: el.scrollLeft, k: max / Math.max(1, tw - w) };
    bar.setPointerCapture(e.pointerId); bar.classList.add("drag"); used(); e.preventDefault();
  });
  bar.addEventListener("pointermove", (e) => { if (drag) el.scrollLeft = drag.left + (e.clientX - drag.x) * drag.k; });
  const end = () => { drag = null; bar.classList.remove("drag"); show(); };
  bar.addEventListener("pointerup", end); bar.addEventListener("pointercancel", end);
  if (window._sbResize) window.removeEventListener("resize", window._sbResize);
  window._sbResize = update; window.addEventListener("resize", update);
  update();
}

function statusTag(s){
  if (s.status === "soldout") return ` <span class="tag soldout">${t("soldOut")}</span>`;
  if (s.status === "closed") return ` <span class="tag closed">${t("closedSec")}</span>`;
  return "";
}

// ▲/▼ against the first logged price; short form for the table, a line for the section card
function priceChg(s, short){
  const h = s.history || [];
  if (h.length < 2 || s.price == null || h[0][1] === s.price) return "";
  const up = s.price > h[0][1], last = h[h.length - 1][0];
  if (short) return `<span class="pchg ${up ? "up" : "down"}" title="${esc(t("priceFrom", { p: eur(h[0][1]), d: dShort(last) }))}">${up ? "▲" : "▼"}</span>`;
  return `<div class="pchg ${up ? "up" : "down"}">${up ? "▲" : "▼"} ${esc(t("priceFrom", { p: eur(h[0][1]), d: dShort(last) }))}</div>`;
}

function sectionPanel(s, g){
  const hist = (s.history || []).slice().reverse();
  const histHtml = hist.length > 1
    ? hist.map((h) => `<div><span class="muted">${esc(dTime(h[0]))}</span><span class="num">${eur(h[1])} <span class="muted">(${t("value").toLowerCase()} ${eur(h[1] - h[2])})</span></span></div>`).join("")
    : (hist.length ? `<div class="muted">${t("unchanged", { d: dTime(hist[0][0]) })}</div>` : "");
  return `<div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><h2 style="margin:0;font-size:22px">${esc(s.title)}${statusTag(s)}</h2><div class="disp num" style="font-size:18px;font-weight:700">${eur(s.price)}</div></div>
    <div class="small muted">${t("value")} ${eur(s.price - (s.fee || 0))} · ${t("fee").toLowerCase()} ${eur(s.fee)}${s.openedLater ? " · " + t("openedLater", { d: dTime(s.openedLater) }) : ""}${s.status === "closed" && s.closedAt ? " · " + t("closedOn", { d: dTime(s.closedAt) }) : ""}</div>
    ${priceChg(s, false)}
    <div class="grid2">
      <div><span class="muted">${t("seats")}</span><b class="num">${nf(s.seats)}</b></div><div><span class="muted">${t("free")}</span><b class="num">${nf(s.available)}</b></div>
      <div><span class="muted">${t("season")}</span><b class="num">${nf(s.season)}</b></div><div><span class="muted">${t("singles")}</span><b class="num">${nf(s.singles)}</b></div>
      <div><span class="muted">${t("revenue")}</span><b class="num">${eur(s.revenue)}</b></div><div><span class="muted">${t("full")}</span><b class="num">${pct(s.seats - s.available, s.seats).toFixed(0)}%</b></div>
    </div>
  </div>
  <div class="panel"><div style="font-weight:600">${t("seatPlan")}</div><div id="seatBox"><div class="note">${t("loading")}</div></div></div>
  <div class="panel"><div style="font-weight:600">${t("priceHistory")}</div><div class="hist">${histHtml}</div></div>`;
}

function loadSeats(gid){
  if (!seatCache[gid]) seatCache[gid] = fetch("seats/" + encodeURIComponent(gid) + ".json", { cache: "no-store" }).then((r) => r.ok ? r.json() : {}).catch(() => ({}));
  return seatCache[gid];
}

async function drawSeats(g, s){
  const box = $("seatBox");
  if (!box) return;
  const all = await loadSeats(g.id);
  const list = all[s.id] || [];
  if (S.game !== g.id || S.sec !== s.id) return;
  if (!list.length){ box.innerHTML = `<div class="note">${t("noLayout")}</div>`; return; }
  const xs = list.map((q) => q[2]), ys = list.map((q) => q[3]);
  const x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0 + 16, h = Math.max(...ys) - y0 + 16;
  const color = { S: "var(--season)", O: "var(--single)", B: "var(--single)", A: "var(--avail)" };
  const rects = list.map((q, i) => `<rect x="${q[2] - x0 + 1.5}" y="${q[3] - y0 + 1.5}" width="13" height="13" rx="3" fill="${color[q[4]]}" stroke="${q[4] === "A" ? "var(--seat-line)" : color[q[4]]}" stroke-width="1" data-i="${i}" ${S.seat === i ? 'stroke-width="2.5" style="stroke:var(--ink)"' : ""}><title>${esc(seatLabel(q))}</title></rect>`).join("");
  const K = 1.1;  // px per seat-map unit: the same seat size in every section
  box.innerHTML = `<div class="seatwrap sb" id="seatWrap"><svg class="seats" viewBox="0 0 ${w} ${h}" width="${Math.round(w * K)}" height="${Math.round(h * K)}" role="img" aria-label="${esc(t("seatPlan") + " " + s.title)}">${rects}</svg></div>
    <div class="small num" id="seatInfo" style="min-height:20px">${esc(S.seat != null && list[S.seat] ? seatLabel(list[S.seat]) : t("seatHint"))}</div>
    <div class="legend"><span><i class="sw" style="background:var(--season)"></i>${t("catS")}</span><span><i class="sw" style="background:var(--single)"></i>${t("legendSingle")}</span><span><i class="sw" style="background:var(--avail);border-color:var(--seat-line)"></i>${t("catA")}</span></div>`;
  const svg = box.querySelector("svg");
  const show = (e) => { const r = e.target.closest("rect[data-i]"); if (!r) return; S.seat = +r.dataset.i; $("seatInfo").textContent = seatLabel(list[S.seat]); };
  svg.addEventListener("mouseover", show); svg.addEventListener("click", show);
}

function seatLabel(q){
  const [row, place, , , cat, price, fee, ts] = q;
  let st = cat === "S" ? t("catS") : cat === "O" ? t("catO", { d: ts ? dTime(ts) : "" }) : cat === "B" ? t("catB") : t("catA");
  if (cat !== "S" && price != null) st += " · " + t("paid", { p: eur(price), v: eur(price - (fee || 0)) });
  return `${t("row")} ${row}, ${t("place")} ${place} · ${st}`;
}

// ---------------------------------------------------------------- share picture
const ICON_SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>';
const ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';
const share = { url: null, file: null, open: false, game: null };

function roundRect(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function wrapLines(c, text, maxW){
  const words = String(text).split(" "), out = []; let line = "";
  for (const w of words){ const tr = line ? line + " " + w : w; if (c.measureText(tr).width > maxW && line){ out.push(line); line = w; } else line = tr; }
  if (line) out.push(line); return out;
}

async function makeShareImage(g, kind){
  try { await Promise.all(["700 120px \"Space Grotesk\"", "500 30px Inter", "700 30px Inter"].map((f) => document.fonts.load(f))); } catch (e) {}
  const draw = kind === "arena" ? drawArenaShare : drawShare;
  // first pass measures how tall the content is, second pass draws at that height
  const probe = document.createElement("canvas"); probe.width = 1080; probe.height = 2400;
  const contentEnd = draw(probe.getContext("2d"), g, 1080, 2400);
  const cv = document.createElement("canvas"); cv.width = 1080; cv.height = Math.ceil(contentEnd + 130);
  draw(cv.getContext("2d"), g, cv.width, cv.height);
  return new Promise((res) => cv.toBlob((b) => res({ blob: b, ratio: cv.width / cv.height }), "image/png"));
}

// header shared by both pictures; returns the y below it
function drawShareHeader(c, g, W, v, HEAD, BODY){
  const x0 = 72, x1 = W - 72; let y = 96;
  c.textBaseline = "alphabetic";
  c.fillStyle = v("--muted"); c.font = `500 26px ${BODY}`; c.fillText(t("eyebrow").toUpperCase(), x0, y);
  y += 58;
  c.font = `700 26px ${BODY}`; const bw = c.measureText(g.comp).width + 28;
  roundRect(c, x0, y - 32, bw, 44, 8); c.lineWidth = 2.5; c.strokeStyle = g.comp === "BCL" ? v("--bcl") : v("--accent"); c.stroke();
  c.fillStyle = c.strokeStyle; c.fillText(g.comp, x0 + 14, y);
  c.fillStyle = v("--muted"); c.font = `500 30px ${BODY}`; const dt = dFull(g.start); c.fillText(dt, x1 - c.measureText(dt).width, y);
  y += 78;
  c.fillStyle = v("--muted"); c.font = `500 34px ${BODY}`; c.fillText(t("vs"), x0, y);
  c.fillStyle = v("--ink"); c.font = `700 76px ${HEAD}`;
  for (const line of wrapLines(c, g.opp, x1 - x0).slice(0, 2)){ y += 86; c.fillText(line, x0, y); }
  return y;
}

function drawShareFooter(c, W, H, v, BODY){
  c.fillStyle = v("--muted"); c.font = `500 26px ${BODY}`;
  c.fillText(t("title") + " · " + t("shareFoot", { d: dTime(DATA.updated) }), 72, H - 56);
  const site = location.host + location.pathname.replace(/index\.html$/, "");
  c.fillText(site, W - 72 - c.measureText(site).width, H - 56);
}

function drawArenaShare(c, g, W, H){
  const v = (n) => cssVar(n), HEAD = '"Space Grotesk", Inter, sans-serif', BODY = 'Inter, system-ui, sans-serif';
  const A = arenaColors(g), x0 = 72, x1 = W - 72;
  c.fillStyle = v("--panel"); c.fillRect(0, 0, W, H);
  let y = drawShareHeader(c, g, W, v, HEAD, BODY);
  y += 52; c.fillStyle = v("--muted"); c.font = `500 30px ${BODY}`;
  c.fillText(`${nf(g.taken)} ${t("expected")} · ${nf(g.available)} ${t("available").toLowerCase()} · ${S.mode === "price" ? t("modePrice") : t("modeTaken")}`, x0, y);
  // the map: section outlines in a 1000x1000 space, cropped to what is drawn
  y += 24;
  const pts = A.shapes.map(([id, p]) => [id, p.split(" ").map((q) => q.split(",").map(Number))]);
  const all = pts.flatMap(([, p]) => p);
  const minX = Math.min(...all.map((p) => p[0]), 380), maxX = Math.max(...all.map((p) => p[0]), 620);
  const minY = Math.min(...all.map((p) => p[1]), 160), maxY = Math.max(...all.map((p) => p[1]), 610);
  const k = (x1 - x0) / (maxX - minX), X = (x) => x0 + (x - minX) * k, Y = (yy) => y + (yy - minY) * k;
  c.lineJoin = "round";
  c.strokeStyle = v("--court"); c.lineWidth = 3;
  roundRect(c, X(390), Y(170), 225 * k, 430 * k, 10 * k); c.stroke();
  c.beginPath(); c.moveTo(X(390), Y(385)); c.lineTo(X(615), Y(385)); c.stroke();
  c.beginPath(); c.arc(X(502), Y(385), 38 * k, 0, Math.PI * 2); c.stroke();
  for (const [id, p] of pts){
    const s = A.byId[id];
    c.beginPath(); p.forEach(([px, py], i) => (i ? c.lineTo(X(px), Y(py)) : c.moveTo(X(px), Y(py)))); c.closePath();
    if (s && s.status === "closed"){ c.setLineDash([7, 6]); c.strokeStyle = v("--muted"); c.lineWidth = 2.5; c.stroke(); }
    else if (s){
      c.setLineDash([]); c.fillStyle = A.scale(sectionValue(s)); c.fill(); c.strokeStyle = v("--line"); c.lineWidth = 2; c.stroke();
      if (s.status === "soldout"){
        c.save(); c.clip(); c.strokeStyle = "rgba(255,255,255,.45)"; c.lineWidth = 6;
        for (let d = -1100; d < 1100; d += 16){ c.beginPath(); c.moveTo(x0 + d, y); c.lineTo(x0 + d + 1100, y + 1100); c.stroke(); }
        c.restore();
      }
    }
    else { c.setLineDash([7, 6]); c.strokeStyle = v("--seat-line"); c.lineWidth = 1.5; c.stroke(); }
  }
  c.setLineDash([]); c.textAlign = "center"; c.textBaseline = "middle"; c.font = `700 22px ${HEAD}`;
  for (const [id, p] of pts){
    const s = A.byId[id]; if (!s) continue;
    const cx = p.reduce((a, q) => a + q[0], 0) / p.length, cy = p.reduce((a, q) => a + q[1], 0) / p.length;
    c.fillStyle = A.labelInk(A.scale(sectionValue(s))); c.fillText(shortTitle(s.title), X(cx), Y(cy));
  }
  c.textAlign = "left"; c.textBaseline = "alphabetic";
  y = Y(maxY) + 54;
  // legend
  c.font = `500 26px ${BODY}`; c.fillStyle = v("--muted"); c.fillText(A.legend[0], x0, y);
  let lx = x0 + c.measureText(A.legend[0]).width + 16;
  const grad = c.createLinearGradient(lx, 0, lx + 220, 0);
  grad.addColorStop(0, v("--low")); grad.addColorStop(0.5, v("--mid")); grad.addColorStop(1, v("--high"));
  roundRect(c, lx, y - 20, 220, 22, 11); c.fillStyle = grad; c.fill();
  lx += 236; c.fillStyle = v("--muted"); c.fillText(A.legend[1], lx, y);
  lx += c.measureText(A.legend[1]).width + 40;
  c.setLineDash([6, 5]); c.strokeStyle = v("--seat-line"); c.lineWidth = 2; roundRect(c, lx, y - 22, 26, 26, 6); c.stroke(); c.setLineDash([]);
  c.fillText(t("notOnSale"), lx + 38, y);
  // key numbers
  y += 40; const cells = [[t("season"), nf(g.season)], [t("singles"), nf(g.singles)], [t("revenue"), eur(g.revenue)]], colW = (x1 - x0) / 3;
  cells.forEach(([label, val], i) => {
    c.fillStyle = v("--muted"); c.font = `500 28px ${BODY}`; c.fillText(label, x0 + i * colW, y + 36);
    c.fillStyle = v("--ink"); c.font = `700 52px ${HEAD}`; c.fillText(val, x0 + i * colW, y + 96);
  });
  const contentEnd = y + 116;
  drawShareFooter(c, W, H, v, BODY);
  return contentEnd;
}

function drawShare(c, g, W, H){
  const P = 64, v = (n) => cssVar(n);
  const HEAD = '"Space Grotesk", Inter, sans-serif', BODY = 'Inter, system-ui, sans-serif';
  c.fillStyle = v("--panel"); c.fillRect(0, 0, W, H);
  const x0 = 72, x1 = W - 72; let y = 96;
  c.textBaseline = "alphabetic";
  c.fillStyle = v("--muted"); c.font = `500 26px ${BODY}`; c.fillText(t("eyebrow").toUpperCase(), x0, y);
  y += 58;
  // badge + date
  c.font = `700 26px ${BODY}`; const bw = c.measureText(g.comp).width + 28;
  roundRect(c, x0, y - 32, bw, 44, 8); c.lineWidth = 2.5; c.strokeStyle = g.comp === "BCL" ? v("--bcl") : v("--accent"); c.stroke();
  c.fillStyle = c.strokeStyle; c.fillText(g.comp, x0 + 14, y);
  c.fillStyle = v("--muted"); c.font = `500 30px ${BODY}`; const dt = dFull(g.start); c.fillText(dt, x1 - c.measureText(dt).width, y);
  y += 78;
  c.fillStyle = v("--muted"); c.font = `500 34px ${BODY}`; c.fillText(t("vs"), x0, y);
  c.fillStyle = v("--ink"); c.font = `700 76px ${HEAD}`;
  for (const line of wrapLines(c, g.opp, x1 - x0).slice(0, 2)){ y += 86; c.fillText(line, x0, y); }
  y += 50; c.fillStyle = v("--muted"); c.font = `500 32px ${BODY}`; c.fillText(whenText(g), x0, y);
  // big number
  y += 200; c.fillStyle = v("--ink"); c.font = `700 190px ${HEAD}`; const big = nf(g.taken); c.fillText(big, x0, y);
  const bigW = c.measureText(big).width; c.fillStyle = v("--muted"); c.font = `500 36px ${BODY}`; c.fillText(t("expected"), x0 + bigW + 24, y - 12);
  // bar
  y += 56; const bwid = x1 - x0, bh = 34;
  roundRect(c, x0, y, bwid, bh, 17); c.fillStyle = v("--free"); c.fill(); c.lineWidth = 2; c.strokeStyle = v("--line"); c.stroke();
  c.save(); roundRect(c, x0, y, bwid, bh, 17); c.clip();
  const ws = bwid * (g.seats ? g.season / g.seats : 0), wsi = bwid * (g.seats ? g.singles / g.seats : 0);
  c.fillStyle = v("--season"); c.fillRect(x0, y, ws, bh); c.fillStyle = v("--single"); c.fillRect(x0 + ws, y, wsi, bh); c.restore();
  // legend
  y += bh + 50; let lx = x0; c.font = `500 26px ${BODY}`;
  for (const [col, label] of [["--season", t("legendSeason") + " " + nf(g.season)], ["--single", t("legendSingle") + " " + nf(g.singles)], ["--free", t("legendFree") + " " + nf(g.available)]]){
    roundRect(c, lx, y - 22, 26, 26, 6); c.fillStyle = v(col); c.fill(); c.strokeStyle = v("--line"); c.lineWidth = 2; c.stroke();
    c.fillStyle = v("--muted"); c.fillText(label, lx + 38, y); lx += 38 + c.measureText(label).width + 36;
  }
  // metrics 2x2 (+ attendance for played games)
  const cells = [[t("singles"), nf(g.singles)], [t("available"), nf(g.available)], [t("revenue"), eur(g.revenue)], [t("avg"), g.singles ? eur(g.avg, 2) : "–"]];
  if (g.played && g.attendance != null) cells.splice(2, 0, [t("attendance"), nf(g.attendance)], [t("attVs", { e: "" }).trim(), nf(g.taken)]);
  y += 40; const colW = (x1 - x0) / 2, shown = cells.slice(0, 6);
  shown.forEach(([label, val], i) => {
    const cx = x0 + (i % 2) * colW, cy = y + Math.floor(i / 2) * 128;
    c.fillStyle = v("--muted"); c.font = `500 30px ${BODY}`; c.fillText(label, cx, cy + 36);
    c.fillStyle = v("--ink"); c.font = `700 58px ${HEAD}`; c.fillText(val, cx, cy + 100);
  });
  const contentEnd = y + Math.ceil(shown.length / 2) * 128;
  // footer
  c.fillStyle = v("--muted"); c.font = `500 26px ${BODY}`;
  c.fillText(t("title") + " · " + t("shareFoot", { d: dTime(DATA.updated) }), x0, H - 56);
  const site = location.host + location.pathname.replace(/index\.html$/, "");
  c.fillText(site, x1 - c.measureText(site).width, H - 56);
  return contentEnd;
}

async function openShare(gid, kind){
  const g = DATA.games.find((x) => x.id === gid); if (!g) return;
  const m = $("shareModal");
  m.setAttribute("aria-label", t("shareTitle"));
  $("shareBody").innerHTML = `<div class="note" style="padding:40px 0;text-align:center">${esc(t("making"))}</div>`;
  $("shareGo").innerHTML = ICON_SHARE + `<span>${esc(t("share"))}</span>`;
  $("shareDl").innerHTML = ICON_DL + `<span>${esc(t("download"))}</span>`;
  $("shareX").setAttribute("aria-label", t("close"));
  m.querySelector(".modal-box").style.setProperty("--ar", kind === "arena" ? "0.66" : "0.86");
  m.hidden = false; share.open = true; share.game = g;
  if (!(history.state && history.state.share)) history.pushState({ share: 1 }, "");   // phone/browser Back closes it
  $("shareX").focus();
  const { blob, ratio } = await makeShareImage(g, kind);
  if (!share.open || share.game !== g) return;
  m.querySelector(".modal-box").style.setProperty("--ar", String(Math.min(0.95, ratio + 0.03)));
  if (share.url) URL.revokeObjectURL(share.url);
  share.url = URL.createObjectURL(blob);
  const name = `ryto-bilietai-${g.start.slice(0, 10)}-${g.opp.replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "").toLowerCase()}${kind === "arena" ? "-arena" : ""}.png`;
  share.file = new File([blob], name, { type: "image/png" });
  $("shareBody").innerHTML = `<img src="${share.url}" alt="${esc(g.opp + " · " + nf(g.taken) + " " + t("expected"))}">`;
  $("shareDl").href = share.url; $("shareDl").setAttribute("download", name);
  const canFiles = !!(navigator.canShare && navigator.canShare({ files: [share.file] }));
  $("shareGo").hidden = !(canFiles || navigator.share);
}

function closeShare(fromBack){
  if (!share.open) return;
  share.open = false; $("shareModal").hidden = true;
  if (share.url){ URL.revokeObjectURL(share.url); share.url = null; }
  if (!fromBack && history.state && history.state.share) history.back();
}

$("shareGo").addEventListener("click", async () => {
  if (!share.file) return;
  const g = share.game, text = `${g.opp} · ${dFull(g.start)} · ${nf(g.taken)} ${t("expected")}`;
  try {
    if (navigator.canShare && navigator.canShare({ files: [share.file] })) await navigator.share({ files: [share.file], title: t("title"), text: text });
    else if (navigator.share) await navigator.share({ title: t("title"), text: text, url: location.href });
  } catch (e) { /* closed the share sheet */ }
});
$("shareX").addEventListener("click", () => closeShare());
$("shareModal").addEventListener("click", (e) => { if (e.target === $("shareModal")) closeShare(); });   // tap outside
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && share.open) closeShare(); });
window.addEventListener("popstate", () => { if (share.open) closeShare(true); });

// ---------------------------------------------------------------- start
setTheme();
render();
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (S.theme === "auto") render(); });
fetch("data.json", { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => {
  DATA = d;
  if (!DATA.games.some((g) => !g.played)) S.when = "played";
  if (S.game){ const g = DATA.games.find((x) => x.id === S.game); if (g) S.when = g.played ? "played" : "upcoming"; }
  render();
}).catch(() => { $("view").innerHTML = `<div class="err">${esc(t("loadErr"))}</div>`; });
</script>
